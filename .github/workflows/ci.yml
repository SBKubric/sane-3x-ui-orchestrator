---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint and syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ansible-core and ansible-lint
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint (profile from .ansible-lint)
        run: ansible-lint

      - name: Syntax check every playbook against every inventory profile
        run: |
          set -e
          for inv in inventories/*/; do
            for pb in site.yml wipe.yml verify.yml; do
              echo "::group::$pb @ $inv"
              ansible-playbook -i "$inv" "$pb" --syntax-check
              echo "::endgroup::"
            done
          done

      - name: neighbour.py (neighbour target scan and Reality handshake check) against fakes
        run: python3 tests/hop/test_neighbour_script.py

      - name: Role hop and verify.yml against the mock panel chain API
        run: python3 tests/hop/test_hop_role.py

      - name: Role panel inbounds and the targets check of verify.yml against the mock panel API
        run: python3 tests/panel/test_panel_inbounds.py

      - name: Role panel's «only 443» front (nginx settings, settings form, IP certificate, facts) against the mock panel API
        run: python3 tests/panel/test_panel_front.py

      - name: Role panel's geosite ru-inside (list, timer, Xray template rule) and its verify.yml check against the mock panel API
        run: python3 tests/panel/test_ru_inside.py

      - name: Role panel's WARP (registration, outbound, last rule) and its verify.yml check against the mock panel API
        run: python3 tests/panel/test_warp.py

      - name: Role panel's AmneziaWG protocol mimicry (I1-I5 templates, new server vs in use, apply flag) and its verify.yml check against the mock panel API
        run: python3 tests/panel/test_awg_mimic.py

      - name: Role panel's domain settings (public sub address, VPN name, DNSExit key, domain expiry, trusted front addresses) and verify.yml checks
        run: python3 tests/panel/test_domain.py

      - name: Probe links per path in verify.yml (mon-server)
        run: python3 tests/monserver/test_verify_paths.py

      - name: Role monserver's Settings (panelUrl on 443 without panelCa) against a mock admin API
        run: python3 tests/monserver/test_settings.py

      - name: verify.yml's «only 443» check (port scan, cover page, API login) on local listeners
        run: python3 tests/common/test_verify_front.py

      - name: dnsexit.py (the showcase's DNS record) against a stand-in for DNSExit's API and nameserver
        run: python3 tests/showcase/test_dnsexit_script.py

      - name: nginx and fail2ban for the showcase test (a real nginx run from a temp dir; fail2ban-regex for the filter)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx fail2ban curl openssl

      - name: Role showcase and its verify.yml step against local edges, the mock panel API and DNSExit
        run: python3 tests/showcase/test_showcase_role.py

      - name: Role monclient inputs and unit
        run: python3 tests/monclient/test_monclient_inputs.py

      - name: wipe.yml on local stand-in boxes
        run: python3 tests/wipe/test_wipe.py

      - name: wipe.yml refuses without confirmation
        run: |
          if ansible-playbook -i inventories/stand-full wipe.yml; then
            echo "wipe.yml ran without -e wipe_confirm=yes" >&2
            exit 1
          fi
