---
# Role panel (SBKubric/3ax-ui-orchestrator#2). Runs on the single host of group `panel`.
#
# Inputs from the inventory (group_vars/all):
#   xui_version        release tag passed to install.sh, e.g. v1.9.0-chain.4
# Inputs from the vault (group_vars/all/vault.yml):
#   panel_user, panel_password, panel_port, panel_base_path   applied with `x-ui setting`
#   tg_bot_token, tg_chat_id                                  applied with `x-ui setting -tgbottoken ...` (optional)
# Inputs from the inventory (group_vars/panel.yml, optional):
#   panel_inbounds     inbounds converged through panel/api/inbounds (tasks/inbounds.yml, README "Inbounds")
# Monitoring is switched on only when group `monserver` is not empty.
#
# Inputs from the inventory (group_vars/all, optional):
#   front_mode         only443 (default) | off: the profile «only 443» (tasks/front.yml, README "Front: only 443")
#   warp_enabled       true (default): client traffic leaves through Cloudflare WARP (tasks/warp.yml, README "WARP")
#   warp_license       WARP+ license key (default empty: the free account)
#   warp_mtu           MTU of the WARP outbound (default 1280)
#   warp_domain_strategy  domainStrategy of the WARP outbound (default ForceIPv4)
#   awg_route_via_xray true (default): AmneziaWG clients' traffic goes through xray's routing (tasks/awg_server.yml)
#   dns_zone, sub_public_url, vpn_name, vpn_name_ttl, domain_expiry, front_trusted_addrs   the panel's domain settings
#                      (tasks/domain.yml, README "Domain: public subscription address and VPN name"); dnsexit_api_key
#                      from the vault
#
# Facts the role leaves for later plays (read via hostvars[groups['panel'][0]]):
#   panel_mon_token    token from `x-ui setting -showMonToken`        (role monserver; only with monitoring)
#   panel_ca_pem       PEM of the self-signed panel certificate; empty behind the front (role monserver: panelCa)
#   panel_url          https://<panel_public_ip><panel_base_path> on 443 behind the front, else
#                      https://<panel_public_ip>:<panel_port><panel_base_path>   (roles hop, monserver, verify)
#
# API login helper for other roles (hop, verify), see README "Panel API from other roles":
#   - ansible.builtin.include_role: {name: panel, tasks_from: api_login}
#   sets panel_api_cookie, panel_api_url, panel_api_host, panel_api_ca_path on the calling host.

# Release tag to install; `x-ui -v` prints it without the leading "v".
panel_version: "{{ xui_version }}"

# Repository whose install.sh and releases are used (install.sh reads XUI_REPO).
panel_repo: SBKubric/sane-3x-ui
# Git ref install.sh is taken from; the tag keeps the prompt sequence in step with the release.
panel_install_ref: "{{ panel_version }}"
panel_install_url: "https://raw.githubusercontent.com/{{ panel_repo }}/{{ panel_install_ref }}/install.sh"
panel_install_script: /root/3ax-ui-install.sh
# install.sh also installs AmneziaWG/WireGuard/nginx; a fresh box can take a while.
panel_install_timeout: 1800

# Panel binary, installed by install.sh, and its service.
panel_bin: /usr/local/x-ui/x-ui
panel_service: x-ui
# The panel's config dir: database (x-ui.db), and here also the self-signed certificate (panel_tls_dir).
panel_etc_dir: /etc/x-ui
# The `x-ui` management wrapper and the log dir install.sh creates.
panel_cli: /usr/bin/x-ui
panel_log_dir: /var/log/x-ui

# Address put into the IP SAN of the self-signed certificate and into panel_url.
panel_public_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

# Where the self-signed certificate is placed; the paths are given to install.sh (SSL option 3)
# and kept in the panel settings with `x-ui cert -webCert/-webCertKey`.
panel_tls_dir: "{{ panel_etc_dir }}/tls"
panel_cert_file: "{{ panel_tls_dir }}/panel.crt"
panel_key_file: "{{ panel_tls_dir }}/panel.key"
panel_csr_file: "{{ panel_tls_dir }}/panel.csr"
panel_cert_valid_days: 3650
# SANs of the certificate. 127.0.0.1 lets on-host API calls (api_login.yml) verify it too.
panel_cert_sans:
  - "IP:{{ panel_public_ip }}"
  - "IP:127.0.0.1"

# Web base path as the panel stores it: leading and trailing slash.
panel_web_base_path: "/{{ panel_base_path | regex_replace('^/+|/+$', '') }}/"

# Telegram bot, from the vault; empty = leave the panel's Telegram settings alone.
panel_tg_bot_token: "{{ tg_bot_token | default('') }}"
panel_tg_chat_id: "{{ tg_chat_id | default('') }}"

# Inbounds of the panel (tasks/inbounds.yml), matched by remark: missing ones are added, declared fields
# that differ are updated, inbounds the list does not name are left alone. One entry:
#   remark          name of the inbound, unique (required)
#   protocol        xray protocol (vless, vmess, trojan, shadowsocks, ...) or amneziawg (required)
#   port            listen port (required for xray; for amneziawg the AWG server's UDP port, default: the
#                   port the panel picked)
#   enable          default true (for amneziawg: the inbound and the AWG server)
#   listen, total, expiryTime, trafficReset       as in the panel; not declared = left as the panel has it
#   settings, streamSettings, sniffing            mappings merged into the panel's JSON (xray only); keys
#                   the entry does not name stay as the panel has them (clients, generated keys)
#   followChain     true: the inbound follows the chain (Reality only). While an edge is active the panel owns
#                   realitySettings target/serverNames (and settings.serverName) and sets them to that edge's
#                   neighbour target; the role converges the declared ones only while no edge is active. The flag
#                   waits (with a warning) while the active edge has no neighbour target: role hop writes it,
#                   and site.yml runs the inbounds again after the hops play.
# A declared streamSettings.network drops the panel's settings of every other transport (panel_inbound_transport_keys);
# on a VLESS inbound whose network is not tcp the clients' flow is cleared (Vision is TCP only). Clients' ids, emails
# and subIds stay.
# Generated on add and read back from the panel afterwards, never stored in the inventory or the vault:
# Reality keys (GET panel/api/server/getNewX25519Cert) and shortIds when streamSettings.security is
# reality; the AWG server's keys and obfuscation (the panel makes them with the server).
panel_inbounds: []
# Fields an entry may carry, per kind.
panel_inbound_xray_keys: [remark, protocol, port, enable, listen, total, expiryTime, trafficReset, followChain, settings, streamSettings,
                          sniffing]
panel_inbound_awg_keys: [remark, protocol, port, enable]
# routeViaXray of the AmneziaWG server (tasks/awg_server.yml): true = the clients' traffic goes through xray (TPROXY
# into the panel's synthetic dokodemo-door inbound, tag and port as the panel has them, awg-tproxy-in:12345 by
# default) and xray's routing applies to it (ru-inside, WARP); false = the kernel NATs it out directly. A change
# bounces the AWG interface (connected clients reconnect) and restarts xray.
panel_awg_route_via_xray: "{{ awg_route_via_xray | default(true) }}"
# The config xray runs (written by the panel with the synthetic inbounds): verify.yml looks for the TPROXY inbound there.
panel_xray_config_file: "{{ panel_bin | dirname }}/bin/config.json"
# Transport settings of streamSettings, one per network; those of another network than the declared one are dropped.
panel_inbound_transport_keys: [tcpSettings, rawSettings, kcpSettings, wsSettings, httpSettings, httpupgradeSettings, splithttpSettings,
                               xhttpSettings, grpcSettings, quicSettings]
# Protocols the role does not manage (their clients and ports live outside the inbound record).
panel_inbound_unsupported: [nativewg, mtproto]
# sniffing of an added inbound that declares none: what the UI sends by default (also for amneziawg).
panel_inbound_default_sniffing:
  enabled: false
  destOverride: [http, tls, quic, fakedns]
  metadataOnly: false
  routeOnly: false
  ipsExcluded: []
  domainsExcluded: []

# AmneziaWG protocol mimicry through the special junk packets I1-I5 (tasks/awg_obfuscation.yml, README "AmneziaWG
# protocol mimicry"; templates in vars/awg_mimic.yml), from the inventory:
#   awg_mimic_protocol     quic (default) | dns | sip | none (the panel's own I1-I5) | custom (awg_mimic_custom)
#   awg_mimic_custom       {i1: ..., i2: ...}: the packets for custom (i1 required, the rest default to empty)
#   awg_obfuscation        optional {jc, jmin, jmax, s1..s4, h1..h4}; unset fields keep the panel's values
#   awg_obfuscation_apply  true: also change an existing server (its clients' .conf files then need replacing)
# Set only on a server the role finds new (no AWG inbound, no AWG clients); otherwise a WARNING, no change.
panel_awg_mimic_protocol: "{{ awg_mimic_protocol | default('quic') }}"
panel_awg_mimic_custom: "{{ awg_mimic_custom | default({}) }}"
panel_awg_obfuscation: "{{ awg_obfuscation | default({}) }}"
panel_awg_obfuscation_apply: "{{ awg_obfuscation_apply | default(false) }}"

# The profile «only 443» (SBKubric/sane-3x-ui ADR 0005, tasks/front.yml). only443: the panel's own pages listen on
# 127.0.0.1 (the admin comes through an SSH tunnel), and nginx on 443 publishes the subscriptions, the chain poll,
# /mon/v1, <base>login and <base>panel/api/ with the box's Let's Encrypt IP certificate; the firewall leaves 443/tcp,
# SSH, 80/tcp (ACME) and the AWG UDP port open. off: the role leaves the panel's front, webListen and
# chainPanelHost as they are (install.sh's default is the front in mode shared).
panel_front_mode: "{{ front_mode | default('only443') }}"
# The Nginx settings only443 sets (panel/api/nginx/apply); the rest (domain, cover page, internal ports) stays as the
# panel has it.
panel_front_settings:
  mode: only443
  subsBehind443: true
  panelBehind443: true
  manageFirewall: true
# Ports kept in the firewall's firewallExtra next to the owner's own: the panel's firewall does not open 80/tcp for the
# ACME webroot by itself, and the IP certificate renews there every 3 days.
panel_front_firewall_keep: ["80"]
# webListen of the panel (tasks/web_settings.yml) and chainPanelHost, the address the innermost hop polls: behind an
# IP-only front it must be an address the IP certificate names.
panel_web_listen: 127.0.0.1
panel_chain_host: "{{ panel_public_ip }}"
# A new webListen takes a restart of the panel.
panel_restart_command: [systemctl, restart, "{{ panel_service }}"]
# The Let's Encrypt IP certificate of the HTTP side on 443 (tasks/ip_cert.yml), issued once through nginx's webroot on
# port 80 the way install.sh issues it (acme_issue_webroot) and renewed by acme.sh's cron every 3 days; a valid one for
# panel_public_ip (at least a day left) is kept. wipe.yml keeps it too (Let's Encrypt: 5 per address a week).
panel_ip_cert_dir: /root/cert/ip
panel_acme_home: /root/.acme.sh
panel_acme_install_url: https://get.acme.sh
panel_acme_webroot: /usr/local/x-ui/acme-webroot
panel_acme_reload_cmd: >-
  systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null; systemctl restart {{ panel_service }} 2>/dev/null || true
# fail2ban for the front's jails (the panel writes them); install.sh installs it with XUI_FAIL2BAN=1, this covers a
# panel that is not reinstalled.
panel_fail2ban_packages: [fail2ban, python3-systemd]
panel_fail2ban_dir: /etc/fail2ban

# geosite:ru-inside (tasks/ru_inside.yml, README "Blocking ru-inside"): traffic of the panel's clients to the domains
# of golukon/russia-only-geosite (reachable only from inside Russia) is dropped silently, by a routing rule of the
# panel's Xray template (domain ext:<file>:<category> -> the blackhole outbound, right after the panel's api rule).
# The list is kept in panel_ru_inside_store_dir and linked into xray's asset folder (install.sh removes that folder;
# x-ui's ExecStartPre puts the link back); a daily timer and every run refresh it: sha256 against the sum file, size,
# category, atomic replace, xray restarted only on a new list. A box that cannot fetch it gets the controller's copy.
# No list at all = no rule (xray refuses to start on an ext: rule without its file). false = the rule is taken out
# and the timer stopped; the files stay.
panel_ru_inside_enabled: true
panel_ru_inside_url: https://raw.githubusercontent.com/golukon/russia-only-geosite/release/geosite.dat
# sha256sum format ("<hex>  geosite.dat"); the controller's get_url looks for the list's file name in it.
panel_ru_inside_sha256_url: "{{ panel_ru_inside_url }}.sha256sum"
panel_ru_inside_category: ru-inside
# Name in xray's asset folder: not one of the panel's own geo files (geosite.dat, geosite_RU.dat, ...) and not
# geosite_<alias>.dat / geoip_<alias>.dat, which the panel's custom geo resources write.
panel_ru_inside_file: ru-inside.dat
panel_ru_inside_asset_dir: "{{ panel_bin | dirname }}/bin"
panel_ru_inside_store_dir: /var/lib/3ax-ru-inside
# The refresh script (files/ru_inside.py), its settings and its units (<unit>.service + <unit>.timer, and a drop-in
# for the panel's service).
panel_ru_inside_script: /usr/local/sbin/3ax-ru-inside
panel_ru_inside_config: /etc/3ax-ru-inside.json
panel_ru_inside_unit: 3ax-ru-inside
panel_ru_inside_systemd_dir: /etc/systemd/system
# false: the units are written but systemd is not asked to load, start or check them (tests; a box without systemd).
panel_ru_inside_systemd: true
# The release comes out at about 03:30 UTC.
panel_ru_inside_on_calendar: "*-*-* 05:00:00 UTC"
panel_ru_inside_randomized_delay: 1h
# Size sanity of a downloaded list (the real one is about 13 KB) and the download timeout in seconds.
panel_ru_inside_min_bytes: 1024
panel_ru_inside_max_bytes: 16777216
panel_ru_inside_timeout: 60
# How the timer restarts xray on a new list: what `x-ui restart-xray` does (the panel restarts xray on SIGUSR1).
panel_ru_inside_restart_command: [systemctl, reload, "{{ panel_service }}"]
# The rule is found by its ruleTag, or by its domain entry when the panel's routing editor has dropped the tag.
panel_ru_inside_rule_tag: 3ax-ru-inside
panel_ru_inside_outbound: blocked
# verify.yml warns when the list's last good check (the file's mtime) is older than this many days.
panel_ru_inside_max_age_days: 3
# Derived.
panel_ru_inside_command: "{{ panel_ru_inside_script }} --config {{ panel_ru_inside_config }}"
panel_ru_inside_rule:
  type: field
  ruleTag: "{{ panel_ru_inside_rule_tag }}"
  domain: ["ext:{{ panel_ru_inside_file }}:{{ panel_ru_inside_category }}"]
  outboundTag: "{{ panel_ru_inside_outbound }}"

# WARP (tasks/warp.yml, README "WARP"): the panel's built-in Cloudflare WARP registration (POST <base>panel/xray/warp/
# data|reg|config|license, web/service/warp.go), a WireGuard outbound tagged `warp` in the Xray template built from it
# the way the panel's WARP modal builds it (warp_modal.html collectConfig), and one last routing rule that sends all
# remaining client traffic (tcp,udp; AmneziaWG through awg-tproxy-in too) to it. The rules before it stay as they are.
# An existing registration is reused, never replaced. A registration that fails (Cloudflare out of reach) writes no
# rule: xray would send the traffic into an outbound that is not there. false = our rule and the `warp` outbound are
# taken out (the outbound stays while another rule points at it); the registration stays in the panel.
panel_warp_enabled: "{{ warp_enabled | default(true) }}"
# WARP+ license key; empty = the free account the registration gets.
panel_warp_license: "{{ warp_license | default('') }}"
# Cloudflare's clients use 1280 (the modal writes 1420, SBKubric/sane-3x-ui#6).
panel_warp_mtu: "{{ warp_mtu | default(1280) }}"
# Outbound settings kept as the modal has them; noKernelTun: gVisor TUN, a kernel TUN under root drops UDP (sane-3x-ui#131).
panel_warp_tag: warp
# ForceIPv4, not the modal's ForceIP: with ForceIP xray may resolve engage.cloudflareclient.com to its IPv6
# address, and on a host without IPv6 the handshake then fails ("network unreachable") and all client traffic
# stops (seen on the stand 2026-09-30 after an xray restart). warp_domain_strategy overrides it.
panel_warp_domain_strategy: "{{ warp_domain_strategy | default('ForceIPv4') }}"
panel_warp_workers: 2
panel_warp_no_kernel_tun: true
panel_warp_allowed_ips: ["0.0.0.0/0", "::/0"]
# Seconds the panel may take to reach api.cloudflareclient.com (the panel's client has no timeout of its own).
panel_warp_timeout: 60
# The rule is found by its ruleTag, or by its shape when the panel's routing editor has dropped the tag.
panel_warp_rule_tag: 3ax-warp
panel_warp_rule:
  type: field
  ruleTag: "{{ panel_warp_rule_tag }}"
  network: tcp,udp
  outboundTag: "{{ panel_warp_tag }}"
# verify.yml fetches it from the panel host itself: warp=off there is the baseline (the rule applies to traffic that
# comes in through the inbounds, not to the host's own); the clients see warp=on. Empty = no fetch.
panel_warp_trace_url: https://www.cloudflare.com/cdn-cgi/trace

# The domain (map #52, tasks/domain.yml, README "Domain: public subscription address and VPN name"): settings of the
# panel's Subscription tab (SBKubric/sane-3x-ui docs/spec/users.md §14, §15). An empty value leaves its setting as the
# panel has it (clearing one is done in the panel's form).
# subPublicURL, the origin of every subscription link the panel hands out, saved through the settings form (no CLI
# flag): https://<showcase_domain> (default sub.<dns_zone>) when group showcase has a host and dns_zone is set;
# sub_public_url overrides it. Compared the way the panel stores it (lower case, no trailing /, no default port).
panel_sub_public_url: >-
  {{ sub_public_url | default(('https://' ~ (hostvars[groups['showcase'][0]].showcase_domain | default('sub.' ~ dns_zone)))
     if (groups['showcase'] | default([]) | length > 0 and dns_zone | default('') | length > 0) else '') }}
# The VPN name (DNS name the panel keeps on the active edge through DNSExit, e.g. vpn.example.com), its record's TTL in
# minutes (1-1440, applied with the name) and the domain's registration expiry date (YYYY-MM-DD, renewal reminders),
# through `x-ui setting -vpnName/-vpnNameTtl/-domainExpiry`.
panel_vpn_name: "{{ vpn_name | default('') }}"
panel_vpn_name_ttl: "{{ vpn_name_ttl | default(5) }}"
panel_domain_expiry: "{{ domain_expiry | default('') }}"
# DNSExit API key (the vault's dnsexit_api_key, as role showcase's), through `x-ui setting -dnsExitApiKey`. The panel
# shows it only masked, so the sha256 of the key last applied is kept on the box: the key is set again when the vault's
# differs from it or the panel has none.
panel_dnsexit_api_key: "{{ dnsexit_api_key | default('') }}"
panel_dnsexit_key_state: "{{ panel_etc_dir }}/3ax-dnsexit-key.sha256"
# The front's trusted addresses (frontTrustedAddrs, SBKubric/sane-3x-ui#228, orchestrator#57): addresses and CIDR
# networks the fronts of the panel and of every hop neither limit nor ban, because they call the HTTP side on behalf of
# many clients. The role sets the list to the showcase's address (group showcase: its ansible_host when that is an
# IPv4 address, from vault_hosts, else its default IPv4 from facts; tasks/front_trusted_showcase.yml) followed by
# front_trusted_addrs (a list or a comma-separated string), through `x-ui setting -frontTrustedAddrs`. The role owns
# the whole list while it has one to set: entries added in the panel's form are replaced, so list your own here. No
# showcase and an empty list = the setting is left as the panel has it; so is a showcase whose address is unknown.
# Compared with the panel's list as a set, both normalised the way the panel stores them (filter_plugins/front_trusted.py).
panel_front_trusted_addrs: "{{ front_trusted_addrs | default([]) }}"
panel_front_trusted_ipv4_re: '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$'
# verify.yml (tasks/verify_vpn_name.yml): the VPN name's A record read from DNSExit's nameservers (role showcase's
# files/dnsexit.py --check-only, on the controller) against the active edge's address in the chain registry; a
# mismatch is a WARNING (the panel moves the record at most once in 4 minutes, and resolvers keep the old answer for
# vpnNameTtl minutes).
panel_vpn_name_zone: >-
  {{ dns_zone if dns_zone | default('') | length > 0 and (panel_vpn_name | lower | regex_replace('\.$', '')).endswith('.' ~ dns_zone)
     else panel_vpn_name | lower | regex_replace('\.$', '') | regex_replace('^[^.]*\.', '') }}
panel_vpn_name_nameservers: [ns1.dnsexit.com, ns2.dnsexit.com, ns3.dnsexit.com, ns4.dnsexit.com]
panel_vpn_name_dns_state: "{{ playbook_dir }}/.cache/dnsexit/state.json"
panel_vpn_name_dns_command: ["{{ ansible_playbook_python }}", "{{ role_path }}/../showcase/files/dnsexit.py"]

# Monitoring endpoint (/mon/v1) is opened only when the profile has a mon-server.
panel_monitoring: "{{ groups['monserver'] | default([]) | length > 0 }}"

# Panel API as seen by api_login.yml: calls run on the panel host itself (delegate_to) against
# 127.0.0.1 and verify the self-signed certificate.
panel_api_host: "{{ groups['panel'][0] }}"
panel_api_url: "https://127.0.0.1:{{ panel_port }}{{ panel_web_base_path }}"
panel_api_ca_path: "{{ panel_cert_file }}"
# false = api_login.yml reports a failed login in panel_api_logged_in instead of failing.
panel_api_login_required: true

# wipe.yml (tasks/wipe.yml): what install.sh and the panel leave on the box: config dir with the database
# and the certificate, install dir, `x-ui` wrapper, log dir, install.sh itself; and the ru-inside list, its script
# and settings (its units go with the panel's service).
panel_wipe_paths:
  - "{{ panel_etc_dir }}"
  - "{{ panel_bin | dirname }}"
  - "{{ panel_cli }}"
  - "{{ panel_log_dir }}"
  - "{{ panel_install_script }}"
  - "{{ panel_ru_inside_store_dir }}"
  - "{{ panel_ru_inside_script }}"
  - "{{ panel_ru_inside_config }}"
# Tunnel interfaces the panel brings up from its database (AmneziaWG, WireGuard): every <iface>.conf in
# these directories is taken down with its quick tool and deleted, as `x-ui uninstall` does. The
# packages stay installed (a fresh install.sh finds them).
panel_wipe_tunnel_dirs:
  - {dir: /etc/amnezia/amneziawg, quick: awg-quick}
  - {dir: /etc/wireguard, quick: wg-quick}
# nginx front the panel generates for port 443: its own files and the marked stream block it adds to
# nginx.conf (everything outside the markers stays).
panel_wipe_nginx_files:
  - /etc/nginx/stream-enabled/3ax-ui.conf
  - /etc/nginx/conf.d/3ax-ui.conf
  - /etc/nginx/http.d/3ax-ui.conf
panel_wipe_nginx_conf: /etc/nginx/nginx.conf
# iptables/ip6tables chain of the panel's firewall, jumped to from INPUT.
panel_wipe_firewall_chain: THREEAX-IN
# TPROXY wiring of tunnels routed through Xray (the panel's tunnel kinds: AmneziaWG 0x1/100, WireGuard
# 0x2/101): mangle PREROUTING rules with this mark, the fwmark policy rule and the routing table.
panel_wipe_tproxy:
  - {fwmark: "0x1", table: "100"}
  - {fwmark: "0x2", table: "101"}

# verify.yml (tasks/verify.yml, tasks/verify_targets.yml): how long the monitoring targets may take to
# come UP after a converge (retries x delay seconds, 3 minutes by default).
panel_verify_targets_retries: 18
panel_verify_targets_delay: 10
