---
# verify.yml, last step (only with a mon-client in the inventory): the panel's Monitoring page data
# (GET panel/api/monitoring/targets) must show a live contact with mon-server, and every enabled inbound
# (xray and the AmneziaWG one alike) with a target for every mon-client of group monclient on each path its
# mon_paths expands to, all of them UP. Waits up to panel_verify_targets_retries x panel_verify_targets_delay
# seconds (3 minutes) for that.
# Expansion (monitoring contract 3): the probed hops are those of group hops (verify's panel step has already
# required each of them joined), by path <hop_role>:<hop_name>. direct -> direct; hops -> every probed hop, or
# proxy when group hops is empty; edge:/inner:<name> -> that path while it is a probed hop, else nothing.
# The AWG probe-peer cap (the panel's monProbePeerLimit, 32) is not modelled: a stand stays far below it.
- name: Log in to the panel
  ansible.builtin.include_tasks: api_login.yml

# mon_name and mon_paths as role monclient reads them (default: inventory hostname, direct and hops).
- name: Read the mon-client paths of group monclient
  ansible.builtin.set_fact:
    panel_verify_mon_paths: >-
      {%- set hop_paths = [] -%}
      {%- for h in groups['hops'] | default([]) -%}
      {%-   set _ = hop_paths.append(hostvars[h].hop_role ~ ':' ~ hostvars[h].hop_name | default(h)) -%}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for h in groups['monclient'] | default([]) -%}
      {%-   set expanded = [] -%}
      {%-   for path in hostvars[h].mon_paths | default(['direct', 'hops']) -%}
      {%-     if path == 'direct' -%}
      {%-       set _ = expanded.append(path) -%}
      {%-     elif path == 'hops' -%}
      {%-       set _ = expanded.extend(hop_paths if hop_paths else ['proxy']) -%}
      {%-     elif path in hop_paths -%}
      {%-       set _ = expanded.append(path) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   for path in expanded | unique -%}
      {%-     set _ = out.append((hostvars[h].mon_name | default(h)) ~ '/' ~ path) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Wait for every monitoring target to be UP
  ansible.builtin.uri:
    url: "{{ panel_api_url }}panel/api/monitoring/targets"
    headers:
      Cookie: "{{ panel_api_cookie }}"
    ca_path: "{{ panel_api_ca_path }}"
    return_content: true
    status_code: [200]
  delegate_to: "{{ panel_api_host }}"
  register: panel_verify_targets
  # Targets of disabled inbounds are PAUSED by design; retired ones belong to a mon-client that is gone.
  # Every enabled inbound needs a live target per mon-client and path: "<kind>/<inboundId>/<mon-client>/<path>".
  until: >-
    (panel_verify_targets.json.success | default(false) | bool)
    and not (panel_verify_targets.json.obj.stale | default(true) | bool)
    and panel_verify_live | length > 0
    and panel_verify_live | rejectattr('state', 'equalto', 'UP') | list | length == 0
    and panel_verify_expected | difference(panel_verify_covered) | length == 0
  vars:
    panel_verify_enabled: "{{ panel_verify_targets.json.obj.inbounds | default([], true) | selectattr('enable') | list }}"
    panel_verify_live: "{{ panel_verify_enabled | map(attribute='targets') | flatten | rejectattr('retired') | list }}"
    panel_verify_covered: >-
      {{ panel_verify_live | map(attribute='inboundKind')
         | zip(panel_verify_live | map(attribute='inboundId') | map('string'), panel_verify_live | map(attribute='monClientName'),
               panel_verify_live | map(attribute='path'))
         | map('join', '/') | list }}
    panel_verify_expected: >-
      {{ panel_verify_enabled | map(attribute='kind') | zip(panel_verify_enabled | map(attribute='inboundId') | map('string'))
         | map('join', '/') | product(panel_verify_mon_paths) | map('join', '/') | list }}
  retries: "{{ panel_verify_targets_retries | int }}"
  delay: "{{ panel_verify_targets_delay | int }}"
  failed_when: false
  no_log: true

- name: Explain what is not UP
  ansible.builtin.set_fact:
    panel_verify_targets_problems: >-
      {%- set obj = panel_verify_targets.json.obj | default({}, true) -%}
      {%- set out = [] -%}
      {%- if not (panel_verify_targets.json.success | default(false) | bool) -%}
      {%-   set _ = out.append('GET monitoring/targets failed: HTTP ' ~ panel_verify_targets.status | default('?') ~ ' '
                               ~ panel_verify_targets.json.msg | default(panel_verify_targets.msg | default(''))) -%}
      {%- else -%}
      {%-   if obj.stale | default(false) -%}
      {%-     set _ = out.append('the panel has no fresh contact with mon-server (stale since '
                                 ~ ('%Y-%m-%d %H:%M:%S UTC' | strftime((obj.staleSince | int) // 1000, utc=true)) ~ ')') -%}
      {%-   endif -%}
      {%-   set live = [] -%}
      {%-   for ib in obj.inbounds | default([], true) | selectattr('enable') -%}
      {%-     for t in ib.targets | rejectattr('retired') -%}
      {%-       set _ = live.append(t) -%}
      {%-       if t.state != 'UP' -%}
      {%-         set _ = out.append(t.monClientName ~ '/' ~ t.path ~ ' -> ' ~ (ib.remark or ib.tag) ~ ' (' ~ ib.kind ~ ' '
                                     ~ ib.inboundId ~ ', port ' ~ ib.port ~ '): ' ~ t.state ~ ((' - ' ~ t.reason) if t.reason else '')) -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endfor -%}
      {%-   if obj.inbounds | default([], true) | selectattr('enable') | list | length == 0 -%}
      {%-     set _ = out.append('the panel has no enabled inbound (panel_inbounds in the inventory, role panel)') -%}
      {%-   elif live | length == 0 -%}
      {%-     set _ = out.append('no monitoring targets on any enabled inbound (did mon-server fetch the probe configs?)') -%}
      {%-   endif -%}
      {%-   for ib in obj.inbounds | default([], true) | selectattr('enable') -%}
      {%-     set have = [] -%}
      {%-     for t in ib.targets | rejectattr('retired') -%}
      {%-       set _ = have.append(t.monClientName ~ '/' ~ t.path) -%}
      {%-     endfor -%}
      {%-     set missing = panel_verify_mon_paths | reject('in', have) | list -%}
      {%-     if live and missing -%}
      {%-       set _ = out.append((ib.remark or ib.tag) ~ ' (' ~ ib.kind ~ ' ' ~ ib.inboundId ~ ', port ' ~ ib.port
                                   ~ ') has no target for ' ~ missing | join(', ')) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}

- name: Require every monitoring target UP
  ansible.builtin.assert:
    that:
      - panel_verify_targets_problems | length == 0
    fail_msg: >-
      monitoring targets not UP after {{ panel_verify_targets_retries | int * panel_verify_targets_delay | int }}s:
      {{ panel_verify_targets_problems | join('; ') }}
    success_msg: >-
      monitoring: {{ panel_verify_targets.json.obj.inbounds | selectattr('enable') | map(attribute='targets') | flatten
                     | rejectattr('retired') | list | length }} targets UP on
      {{ panel_verify_targets.json.obj.inbounds | selectattr('enable') | map(attribute='remark') | join(', ') }}
