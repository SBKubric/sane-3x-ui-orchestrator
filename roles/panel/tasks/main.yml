---
# Role panel: install/update by tag, self-signed TLS, account from the vault, Telegram and monitoring
# through the x-ui CLI, geosite:ru-inside dropped by the Xray template, the rest of the clients' traffic through WARP,
# inbounds from panel_inbounds through the API, the domain settings (public subscription address, VPN name, DNSExit),
# the «only 443» front (front_mode); leaves panel_url, panel_ca_pem and (with monitoring) panel_mon_token as facts.
- name: Check role inputs
  ansible.builtin.assert:
    that:
      - xui_version is defined and xui_version | string | length > 0
      - panel_user is defined and panel_user | string | length > 0
      - panel_password is defined and panel_password | string | length > 0
      - panel_port is defined and panel_port | int > 0 and panel_port | int < 65536
      - panel_base_path is defined and panel_base_path | regex_replace('^/+|/+$', '') | length >= 4
      - (panel_tg_bot_token | length > 0) == (panel_tg_chat_id | string | length > 0)
      - panel_front_mode in ['only443', 'off']
    fail_msg: >-
      role panel needs xui_version (group_vars) and panel_user, panel_password, panel_port 1-65535,
      panel_base_path of at least 4 characters (vault); tg_bot_token and tg_chat_id go together;
      front_mode is only443 or off.
    quiet: true

- name: Gather network facts for the certificate address
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", network]
  when: ansible_facts['default_ipv4']['address'] is not defined

- name: Self-signed TLS certificate
  ansible.builtin.include_tasks: tls.yml

- name: Install or update the panel
  ansible.builtin.include_tasks: install.yml

- name: Keep the certificate paths in the panel settings
  ansible.builtin.include_tasks: cert_sync.yml

- name: Account, port and web base path from the vault
  ansible.builtin.include_tasks: account.yml

- name: Telegram bot from the vault
  ansible.builtin.include_tasks: telegram.yml
  when: panel_tg_bot_token | length > 0

- name: Monitoring endpoint and token
  ansible.builtin.include_tasks: monitoring.yml
  when: panel_monitoring | bool

- name: Public subscription address, VPN name and DNSExit
  ansible.builtin.include_tasks: domain.yml

- name: Apply pending panel restarts
  ansible.builtin.meta: flush_handlers

# Early: a reinstall above (install.sh removes xray's asset folder) gets the list's link back right away.
- name: Drop traffic to geosite:ru-inside
  ansible.builtin.include_tasks: ru_inside.yml

# After the ru-inside rule: the WARP rule goes after every rule the template has.
- name: Client traffic through WARP
  ansible.builtin.include_tasks: warp.yml

# Before the hops play (site.yml order): hops that join afterwards find the relayed ports in the chain
# document; hops already joined pick up the new revision on their next poll.
- name: Inbounds from panel_inbounds
  ansible.builtin.include_tasks: inbounds.yml
  when: panel_inbounds | length > 0

# After the inbounds: the front routes the Reality inbound by its server name and refuses to come up without one.
- name: The profile «only 443»
  ansible.builtin.include_tasks: front.yml

- name: Export panel facts
  ansible.builtin.include_tasks: facts.yml
