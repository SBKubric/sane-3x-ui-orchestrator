---
# verify.yml on the panel host (with an amneziawg entry in panel_inbounds and awg_v3 on), with the api_login session:
# AmneziaWG 3.0 as the kernel got it. Failures: the server's <interface>.conf (panel_awg_conf_dir, written by the panel
# when it applies the server) differs from the panel's AWG server in HeaderProtectionKey, S1-S4 or a 3.0 field, or the
# .conf the panel hands a client (awg_verify_client, default the first enabled AWG client) has another
# HeaderProtectionKey. Warnings: a host whose kernel module does not take 3.0, and a server still without header
# protection or with S1-S4 below 12 (a server in use keeps its set until awg_obfuscation_apply). Read-only; no key is
# printed.
- name: Load the AmneziaWG obfuscation constants
  ansible.builtin.include_vars:
    file: awg_mimic.yml

- name: Ask the panel whether the kernel takes AmneziaWG 3.0
  ansible.builtin.include_tasks: api.yml
  vars:
    panel_call_path: awg/server/status
    panel_call_method: GET

- name: Keep the AmneziaWG 3.0 support
  ansible.builtin.set_fact:
    panel_v3_supported: "{{ panel_call.obj.supportsV3 | default(false) | bool }}"

- name: Warn that the host does not take AmneziaWG 3.0
  ansible.builtin.debug:
    msg: >-
      WARNING: AmneziaWG 3.0: the kernel module on {{ inventory_hostname }} does not take the 3.0 parameters
      (awg/server/status: supportsV3 false, version {{ panel_call.obj.awgVersion | default('unknown') }}); upgrade amneziawg
      and run site.yml
  when: not panel_v3_supported | bool

- name: Check AmneziaWG 3.0
  when: panel_v3_supported | bool
  block:
    - name: Read the AmneziaWG server
      ansible.builtin.include_tasks: api.yml
      vars:
        panel_call_path: awg/server
        panel_call_method: GET

    # The [Interface] lines tunnel.writeObfuscation puts in both configs, as the panel's record says they should read:
    # S3/S4 only above 0, a 3.0 field only when set, the two switches only when on.
    - name: Keep what verify needs of the AmneziaWG server
      ansible.builtin.set_fact:
        panel_v3_server:
          enable: "{{ panel_call.obj.enable | default(false) | bool }}"
          conf: "{{ panel_awg_conf_dir }}/{{ panel_call.obj.interfaceName | default('', true) or 'awg0' }}.conf"
          key: "{{ panel_call.obj.headerProtectionKey | default('', true) | trim }}"
          pads: "{{ ['s1', 's2', 's3', 's4'] | map('extract', panel_call.obj) | map('int') | list }}"
          lines: >-
            {%- set out = {'S1': panel_call.obj.s1 | string, 'S2': panel_call.obj.s2 | string,
                           'S3': (panel_call.obj.s3 | string) if panel_call.obj.s3 | int > 0 else '',
                           'S4': (panel_call.obj.s4 | string) if panel_call.obj.s4 | int > 0 else '',
                           'HeaderProtectionKey': panel_call.obj.headerProtectionKey | default('', true) | trim,
                           'RandomTrailers': 'on' if panel_call.obj.randomTrailers | default(false) | bool else '',
                           'DisableCookies': 'on' if panel_call.obj.disableCookies | default(false) | bool else ''} -%}
            {%- for key in panel_awg_v3_range_keys -%}
            {%-   set _ = out.update({key[0] | upper ~ key[1:]: panel_call.obj[key] | default('', true) | trim}) -%}
            {%- endfor -%}
            {{ out }}
      no_log: true

    - name: Warn about a server without header protection
      ansible.builtin.debug:
        msg: >-
          WARNING: AmneziaWG 3.0: the panel's AWG server has
          {{ (([] if panel_v3_server.key else ['no HeaderProtectionKey'])
              + ([(['S1', 'S2', 'S3', 'S4'] | zip(panel_v3_server.pads) | selectattr('1', 'lt', 12) | map(attribute='0') | join(', '))
                  ~ ' below 12'] if panel_v3_server.pads | min < 12 else [])) | join(' and ') }}
          (a server in use keeps its set until site.yml runs with awg_obfuscation_apply=true)
      when: not panel_v3_server.key or panel_v3_server.pads | min < 12

    - name: Read the AmneziaWG server's config
      ansible.builtin.slurp:
        src: "{{ panel_v3_server.conf }}"
      register: panel_v3_conf
      failed_when: false
      no_log: true
      when: panel_v3_server.enable | bool

    - name: Compare the AmneziaWG server's config with the panel
      ansible.builtin.set_fact:
        panel_v3_conf_diff: >-
          {%- set have = {} -%}
          {%- set section = namespace(name='') -%}
          {%- for line in (panel_v3_conf.content | default('') | b64decode).splitlines() | map('trim') -%}
          {%-   if line.startswith('[') -%}
          {%-     set section.name = line -%}
          {%-   elif section.name == '[Interface]' and '=' in line and not line.startswith('#') -%}
          {%-     set kv = line.split('=', 1) -%}
          {%-     set _ = have.update({kv[0] | trim: kv[1] | trim}) -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set out = [] -%}
          {%- for key, value in panel_v3_server.lines.items() if have[key] | default('') != value -%}
          {%-   set _ = out.append(key) -%}
          {%- endfor -%}
          {{ out }}
      no_log: true
      when: panel_v3_server.enable | bool

    - name: Require the AmneziaWG server's config to match the panel
      ansible.builtin.assert:
        that:
          - panel_v3_conf.content is defined
          - panel_v3_conf_diff | length == 0
        fail_msg: >-
          AmneziaWG 3.0: {{ (panel_v3_server.conf ~ " differs from the panel's AWG server in " ~ panel_v3_conf_diff | join(', ')
          ~ ' (the kernel module took fewer fields, or the panel did not apply the last save)') if panel_v3_conf.content is defined
          else ('no ' ~ panel_v3_server.conf ~ ' on ' ~ inventory_hostname ~ ', although the AWG server is on') }}
        quiet: true
      when: panel_v3_server.enable | bool

    - name: List the AmneziaWG clients
      ansible.builtin.include_tasks: api.yml
      vars:
        panel_call_path: awg/clients
        panel_call_method: GET

    - name: Pick the AmneziaWG client to check
      ansible.builtin.set_fact:
        panel_v3_client: >-
          {{ (panel_call.obj | default([], true) | selectattr('name', 'equalto', panel_awg_verify_client) | list
              + panel_call.obj | default([], true) | selectattr('email', 'equalto', panel_awg_verify_client) | list
              if panel_awg_verify_client | length > 0 else
              panel_call.obj | default([], true) | selectattr('enable', 'defined') | selectattr('enable') | list)
             | map('dict2items') | map('selectattr', 'key', 'in', ['id', 'name', 'email']) | map('items2dict') | first | default({}) }}

    - name: Require the AmneziaWG client named by awg_verify_client
      ansible.builtin.assert:
        that:
          - panel_v3_client | length > 0
        fail_msg: "AmneziaWG 3.0: awg_verify_client {{ panel_awg_verify_client }} is no AWG client (name or email) on the panel"
        quiet: true
      when: panel_awg_verify_client | length > 0

    - name: Read the client's .conf
      ansible.builtin.include_tasks: api.yml
      vars:
        panel_call_path: "awg/client/{{ panel_v3_client.id }}/config"
        panel_call_method: GET
      when: panel_v3_client | length > 0

    - name: Compare the client's key with the server's
      ansible.builtin.set_fact:
        panel_v3_client_same_key: >-
          {%- set found = panel_call.obj | default('', true) | string | regex_findall('(?m)^\s*HeaderProtectionKey\s*=\s*(\S+)\s*$') -%}
          {{ (found | first | default('')) == panel_v3_server.key }}
      no_log: true
      when: panel_v3_client | length > 0

    - name: Require the server's key in the client's .conf
      ansible.builtin.assert:
        that:
          - panel_v3_client_same_key | bool
        fail_msg: >-
          AmneziaWG 3.0: the .conf of client {{ panel_v3_client.email | default('', true) or panel_v3_client.name }} has another
          HeaderProtectionKey than the server ({{ 'none' if not panel_v3_server.key else 'the panel hands out a stale one' }}):
          it cannot handshake
        quiet: true
      when: panel_v3_client | length > 0

    - name: Report AmneziaWG 3.0
      ansible.builtin.debug:
        msg: >-
          AmneziaWG 3.0: {{ (panel_v3_server.conf | basename ~ ' has '
          ~ ('HeaderProtectionKey, ' if panel_v3_server.key else 'no HeaderProtectionKey, ')
          ~ 'S1-S4 ' ~ panel_v3_server.pads | join('/') ~ " and the panel's 3.0 fields")
          if panel_v3_server.enable | bool else 'the AWG server is off, its config not checked' }};
          {{ ('the .conf of client ' ~ (panel_v3_client.email | default('', true) or panel_v3_client.name)
              ~ (' carries the same key' if panel_v3_server.key else ' carries no key either'))
             if panel_v3_client | length > 0 else 'no AWG client to check a .conf of' }}
