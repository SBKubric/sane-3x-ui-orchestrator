---
# Reads the panel's Xray template (POST <base>panel/xray/, the page Xray settings reads) with the api_login session.
# Facts: panel_ru_inside_form (the whole answer: xraySetting, outboundTestUrl, hiddifyCompat, ...),
# panel_ru_inside_template (xraySetting, the template itself) and panel_ru_inside_rules (our rules in it: by ruleTag,
# or by the domain entry when the panel's routing editor dropped the tag).
# no_log: the template carries the private keys of WARP/NordVPN outbounds.
- name: Read the panel's Xray template
  ansible.builtin.uri:
    url: "{{ panel_api_url }}panel/xray/"
    method: POST
    headers:
      Cookie: "{{ panel_api_cookie }}"
      X-Requested-With: XMLHttpRequest
    ca_path: "{{ panel_api_ca_path }}"
    return_content: true
    status_code: [200]
  delegate_to: "{{ panel_api_host }}"
  register: panel_ru_inside_read
  failed_when: false
  check_mode: false
  no_log: true

- name: Require the Xray template
  ansible.builtin.assert:
    that:
      - panel_ru_inside_read.status | default(0) == 200
      - panel_ru_inside_read.json.success | default(false) | bool
    fail_msg: >-
      POST panel/xray/ failed: HTTP {{ panel_ru_inside_read.status | default('?') }}
      {{ panel_ru_inside_read.json.msg | default(panel_ru_inside_read.msg | default('')) }}
    quiet: true

- name: Keep the Xray template
  ansible.builtin.set_fact:
    panel_ru_inside_form: "{{ panel_ru_inside_read.json.obj | from_json }}"
    panel_ru_inside_template: "{{ (panel_ru_inside_read.json.obj | from_json).xraySetting }}"
  no_log: true

- name: Find the ru-inside rules in the Xray template
  ansible.builtin.set_fact:
    panel_ru_inside_rules: >-
      {%- set out = [] -%}
      {%- for rule in (panel_ru_inside_template.routing | default({})).rules | default([]) -%}
      {%-   if rule.ruleTag | default('') == panel_ru_inside_rule_tag or panel_ru_inside_rule.domain[0] in rule.domain | default([]) -%}
      {%-     set _ = out.append(rule) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
