---
# wipe.yml on the panel host: the service, what the panel set up on the system (tunnel interfaces, nginx
# front, firewall chain; the same steps as `x-ui uninstall`), then its files: database, certificate,
# install dir. Packages installed by install.sh (AmneziaWG, WireGuard, nginx) stay. A box without a panel
# reports ok; a second wipe changes nothing.
- name: Remove the panel service
  ansible.builtin.include_role:
    name: common
    tasks_from: wipe_service
  vars:
    common_wipe_unit: "{{ panel_service }}"

- name: Take down the panel's tunnels, nginx front and firewall chain
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      removed=()
      # Tunnel interfaces: down with their quick tool (runs the PostDown rules), then the config goes.
      for entry in {{ panel_wipe_tunnel_dirs | map(attribute='dir') | zip(panel_wipe_tunnel_dirs | map(attribute='quick'))
                      | map('join', ':') | map('quote') | join(' ') }}; do
        dir=${entry%:*}
        quick=${entry##*:}
        for conf in "$dir"/*.conf; do
          [ -f "$conf" ] || continue
          iface=$(basename "$conf" .conf)
          if command -v ip >/dev/null 2>&1 && ip link show dev "$iface" >/dev/null 2>&1; then
            "$quick" down "$conf" >/dev/null 2>&1 || ip link delete dev "$iface" >/dev/null 2>&1 || true
            removed+=("interface $iface")
          fi
          rm -f -- "$conf"
          removed+=("$conf")
        done
      done
      # nginx: the panel's own files and its marked block in nginx.conf.
      nginx_changed=0
      for f in {{ panel_wipe_nginx_files | map('quote') | join(' ') }}; do
        if [ -f "$f" ]; then
          rm -f -- "$f"
          removed+=("$f")
          nginx_changed=1
        fi
      done
      main={{ panel_wipe_nginx_conf | quote }}
      if [ -f "$main" ] && grep -q '# --- BEGIN 3AX-UI STREAM ---' "$main"; then
        sed -i '/# --- BEGIN 3AX-UI STREAM ---/,/# --- END 3AX-UI STREAM ---/d' "$main"
        removed+=("3AX-UI stream block of $main")
        nginx_changed=1
      fi
      if [ "$nginx_changed" = 1 ] && command -v nginx >/dev/null 2>&1; then
        if nginx -t >/dev/null 2>&1; then
          systemctl reload nginx >/dev/null 2>&1 || true
        else
          echo "nginx -t fails after removing the panel's config; fix it and reload nginx" >&2
        fi
      fi
      # Firewall: the INPUT jump (possibly repeated) and the chain itself.
      chain={{ panel_wipe_firewall_chain | quote }}
      for bin in iptables ip6tables; do
        command -v "$bin" >/dev/null 2>&1 || continue
        while "$bin" -C INPUT -j "$chain" >/dev/null 2>&1; do
          "$bin" -D INPUT -j "$chain" || break
          removed+=("$bin INPUT jump to $chain")
        done
        if "$bin" -n -L "$chain" >/dev/null 2>&1; then
          "$bin" -F "$chain" && "$bin" -X "$chain" && removed+=("$bin chain $chain")
        fi
      done
      # Tunnels routed through Xray: the TPROXY rules and fwmark policy routing their PostUp adds. A
      # PostDown that no longer lists them (the server was switched to direct routing, or never ran)
      # leaves them behind, and the next tunnel with that name sends all its traffic into a dead port.
      for mark in {{ panel_wipe_tproxy | map(attribute='fwmark') | zip(panel_wipe_tproxy | map(attribute='table'))
                     | map('join', ':') | map('quote') | join(' ') }}; do
        fwmark=${mark%:*}
        table=${mark##*:}
        for bin in iptables ip6tables; do
          command -v "$bin" >/dev/null 2>&1 || continue
          while read -r rule; do
            # shellcheck disable=SC2086
            "$bin" -t mangle ${rule/-A /-D } && removed+=("$bin mangle: ${rule#-A }")
          done < <("$bin" -t mangle -S PREROUTING 2>/dev/null | grep -- "--tproxy-mark $fwmark/$fwmark")
        done
        for family in -4 -6; do
          while ip "$family" rule del fwmark "$fwmark/$fwmark" lookup "$table" >/dev/null 2>&1; do
            removed+=("ip $family rule fwmark $fwmark lookup $table")
          done
          if [ -n "$(ip "$family" route show table "$table" 2>/dev/null)" ]; then
            ip "$family" route flush table "$table" && removed+=("ip $family route table $table")
          fi
        done
      done
      if [ -n "${removed[*]:-}" ]; then
        printf '%s\n' "${removed[@]}"
      fi
    executable: /bin/bash
  register: panel_wipe_system
  changed_when: panel_wipe_system.stdout | length > 0

- name: Remove panel files, database and certificate
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ panel_wipe_paths }}"
