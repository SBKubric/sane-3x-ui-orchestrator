---
# fail2ban for the jails the panel writes with only443 (SBKubric/sane-3x-ui#141). install.sh installs it with
# XUI_FAIL2BAN=1; this covers a panel that is not reinstalled. On a box without sshd's log file (Debian 12 without
# rsyslog) the package's sshd jail keeps fail2ban from starting at all: it reads the journal instead, as install.sh
# sets it up (a file already in that place is left alone).
- name: Install fail2ban
  ansible.builtin.apt:
    name: "{{ panel_fail2ban_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Look for sshd's log file
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/var/log/auth.log, /var/log/secure]
  register: panel_fail2ban_auth_logs

- name: Point the sshd jail at the journal
  ansible.builtin.copy:
    dest: "{{ panel_fail2ban_dir }}/jail.d/3ax-ui-sshd.local"
    content: |
      # Generated by 3AX-UI (#141): sshd logs to the journal on this box, and
      # fail2ban will not start while a jail's log file is missing.
      [sshd]
      backend = systemd
    force: false
    owner: root
    group: root
    mode: "0644"
  when: panel_fail2ban_auth_logs.results | selectattr('stat.exists') | list | length == 0
