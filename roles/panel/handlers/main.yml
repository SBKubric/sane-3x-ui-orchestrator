---
# panel_restart_command: systemctl restart <panel_service>; the tests put a stand-in there.
- name: Restart panel
  ansible.builtin.command:
    argv: "{{ panel_restart_command }}"
  changed_when: true
  listen: panel restart

- name: Wait for panel port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ panel_port | int }}"
    timeout: 120
  listen: panel restart
