---
# Role monclient (SBKubric/3ax-ui-orchestrator#4). Runs on every host of group `monclient`.
#
# Inputs from the inventory:
#   mon_version        release tag of SBKubric/3ax-ui-monitoring   (group_vars/all)
#   mon_xray_version   xray release tag for mon-client             (group_vars/monclient)
#   acme_production    false = trust the vendored LE staging roots (SSL_CERT_FILE)
#   mon_auto_approve   true = approve the pairing request through the mon-server admin API
#   mon_name, mon_region, mon_paths   approval payload             (host_vars, optional)
#   mon_gomemlimit     GOMEMLIMIT of the mon-client service       (optional)
# Inputs from the vault: mon_admin_user, mon_admin_password (admin API of mon-server).
# Input from role monserver: fact monserver_url on hostvars[groups['monserver'][0]] (MON_SERVER_URL).

monclient_repo: SBKubric/3ax-ui-monitoring
monclient_version: "{{ mon_version }}"
monclient_release_url: "https://github.com/{{ monclient_repo }}/releases/download/{{ monclient_version }}"
monclient_asset: mon-client-linux-amd64.tar.gz
monclient_cache_dir: /var/cache/3ax-ui-orchestrator
monclient_bin_path: /usr/local/bin/mon-client

# Official xray release (XTLS/Xray-core), checked against the release's .dgst (SHA2-256).
monclient_xray_version: "{{ mon_xray_version }}"
monclient_xray_release_url: "https://github.com/XTLS/Xray-core/releases/download/{{ monclient_xray_version }}"
monclient_xray_asset: Xray-linux-64.zip
# mon-client's default --xray-bin.
monclient_xray_bin_path: /usr/local/bin/xray

monclient_user: mon-client
monclient_service: mon-client
# Must stay /var/lib/<monclient_service>: the unit's StateDirectory= owns it (mon-client's default
# --state-dir); state.json there means "registered".
monclient_state_dir: "/var/lib/{{ monclient_service }}"
monclient_log_level: info
# Soft memory limit of the Go runtime (GOMEMLIMIT); empty = none. A guard against swap on a small box
# (SBKubric/sane-3x-ui-monitoring#85): mon-client itself stays near 25 MB since the AWG probe's batch-1 bind
# (v0.1.0-stand.5), xray runs as its own process and is not covered.
monclient_gomemlimit: "{{ mon_gomemlimit | default('128MiB') }}"

# mon-server's base URL. Default: the fact monserver_url left by role monserver, or else
# https://<default IPv4 of the monserver host>:443 (gathered on demand).
monclient_server_host: "{{ (groups['monserver'] | default([]) + [''])[0] }}"
monclient_server_url: ""

# Let's Encrypt staging roots for a mon-server on tls.acmeCa=staging (acme_production=false).
# Go reads SSL_CERT_FILE instead of the system bundle file but still reads /etc/ssl/certs, so public
# CAs keep working.
monclient_staging_roots: "{{ not acme_production | default(false) | bool }}"
monclient_le_staging_roots: /etc/mon-client/le-staging-roots.pem

# Approval payload (spec §6 of mon-server): name, region, paths. Paths vocabulary of monitoring contract 3
# (SBKubric/sane-3x-ui-monitoring#61): direct, hops (every probed hop of the chain, including hops added later;
# the proxy path while the chain has no probed hop), or one hop by path, edge:<hop_name> / inner:<hop_name>.
# mon-server refuses the old word proxy.
monclient_name: "{{ mon_name | default(inventory_hostname) }}"
monclient_region: "{{ mon_region | default('') }}"
monclient_paths: "{{ mon_paths | default(['direct', 'hops']) }}"
monclient_path_pattern: '^(direct|hops|(edge|inner):[a-z0-9-]{1,32})$'
monclient_auto_approve: "{{ mon_auto_approve | default(true) | bool }}"
# How long to wait for the pairing code in `journalctl -u mon-client` (a mon-client whose old token
# is refused re-registers after its first heartbeat, up to a minute after start) and for the approved
# box to collect its token. A pending request lives 5 minutes.
monclient_pairing_retries: 36
monclient_pairing_delay: 5

# wipe.yml (tasks/wipe.yml): unit, binaries, config dir (LE staging roots), state dir (state.json with the
# token), downloaded releases; the service user and group go too.
monclient_wipe_paths:
  - "{{ monclient_bin_path }}"
  - "{{ monclient_xray_bin_path }}"
  - "{{ monclient_le_staging_roots | dirname }}"
  - "{{ monclient_state_dir }}"
  - "{{ monclient_cache_dir }}/mon-client"
  - "{{ monclient_cache_dir }}/xray"

# verify.yml (tasks/verify.yml): how long the mon-client may take to be ONLINE (retries x delay seconds).
monclient_verify_retries: 18
monclient_verify_delay: 10
