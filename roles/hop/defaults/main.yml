---
# Role hop (SBKubric/3ax-ui-orchestrator#3, decision SBKubric/3ax-ui-monitoring#55 items 3 and 5).
# Runs on the hosts of group `hops`. The inventory is the source of truth for the panel's chain
# registry: every hop of the group is added (or re-joined) and installed, the edge with
# hop_active becomes the active one, and registry hops missing from the group are deleted.
#
# Per-host inputs (inventories/<profile>/host_vars/<hop>.yml):
#   hop_role       inner | edge                                   (required)
#   hop_position   integer order of inner hops, 1 = next to panel (required for inner)
#   hop_active     true on exactly one edge hop                   (default below)
#   hop_name       name in the chain registry, [a-z0-9-]{1,32}    (default below)
#   hop_next       next hop inward; empty = derived: edge -> outermost inner, inner N -> inner N-1,
#                  inner 1 -> panel (address and sub port of a derived next hop come from the registry)
#   hop_tls        PROXY_TLS mode for install.sh                  (default below)
#   hop_host       public address registered in the chain         (default below)
#   hop_reality_target, hop_reality_server_name   neighbour target of an edge, instead of the scan (see below)
# Group inputs: xui_version (group_vars/all), panel_* from the vault (API login through role panel), front_mode
# (group_vars/all, default only443: the box's front, see hop_front_mode).

hop_name: "{{ inventory_hostname }}"
hop_active: false
hop_next: ""
# Sub port and scheme of an explicit hop_next (a derived next hop takes them from the registry).
hop_next_sub_port: 2096
hop_next_sub_scheme: https

# letsencrypt-ip (production LE for the box IP, issued once per box thanks to idempotency) | none | manual.
hop_tls: letsencrypt-ip
# PROXY_CERT / PROXY_KEY for hop_tls: manual (paths on the hop box).
hop_cert: ""
hop_key: ""
# On a reinstall of a box that already holds a valid LE IP certificate for hop_host, install.sh gets
# PROXY_TLS=manual with that certificate instead of issuing a new one (acme.sh keeps renewing it).
hop_tls_reuse: true
hop_le_cert_dir: /root/cert/ip

# Address registered in the chain and used by the outer neighbour as its next hop.
hop_host: "{{ ansible_facts['default_ipv4']['address'] }}"
# PROXY_DOMAIN: public host name for subscription links; empty = none.
hop_domain: ""
# Sub port of this hop (PROXY_SUB_PORT, registry subPort) and its scheme (registry subScheme).
hop_sub_port: 2096
hop_sub_scheme: "{{ 'http' if hop_tls == 'none' else 'https' }}"

# Next hop of the innermost hop: the panel. Empty address = host of panel_url (a run with the panel
# play), else panel_public_ip from the panel's host_vars, else the panel host's default IPv4. Behind the panel's
# only443 front its subscriptions and the chain poll answer on 443 (the firewall closes the sub port).
hop_panel_host: ""
hop_panel_sub_port: "{{ 443 if front_mode | default('only443') == 'only443' else 2096 }}"
hop_panel_sub_scheme: https

# The box's front (install.sh PROXY_FRONT, proxy.json "front"; SBKubric/sane-3x-ui ADR 0005, #140/#141): only443 = nginx
# takes 443/tcp and passes it on by SNI (next hop, or the edge's neighbour target), the box's HTTP side (subscriptions,
# /chain/v1/, /join/) answers requests by address with the Let's Encrypt IP certificate, the firewall leaves 443/tcp,
# 80/tcp, SSH and the relayed UDP ports open, fail2ban guards it. It needs hop_tls letsencrypt-ip. Once the front is up
# the box reports it on its polls and the panel moves the hop to 443/https in the registry: the role waits for that
# (retries x delay seconds) before it converges the next hop outward, which then dials 443. off = no front.
hop_front_mode: "{{ front_mode | default('only443') }}"
hop_front_retries: 18
hop_front_delay: 10

# Release tag; `x-ui -v` prints it without the leading "v".
hop_version: "{{ xui_version }}"
hop_repo: SBKubric/sane-3x-ui
hop_install_ref: "{{ hop_version }}"
hop_install_url: "https://raw.githubusercontent.com/{{ hop_repo }}/{{ hop_install_ref }}/install.sh"
hop_install_script: /root/3ax-ui-install.sh
hop_install_timeout: 900
# Extra environment for install.sh, e.g. {PROXY_TLS_IPV6: "1"}.
hop_install_environment: {}
# The join token travels to install.sh through this root-only file, never through the command line
# or the task environment; the wrapper deletes it before install.sh starts.
hop_token_file: /root/.3ax-ui-join-token

hop_bin: /usr/local/x-ui/x-ui
hop_proxy_config: /etc/x-ui/proxy.json
# The `x-ui` management wrapper and the log dir install.sh creates.
hop_cli: /usr/bin/x-ui
hop_log_dir: /var/log/x-ui

# After an install, wait for the registry to report the hop joined.
hop_join_retries: 12
hop_join_delay: 5

# Delete registry hops that are not in group `hops` (legacy included). false = report them only.
hop_prune: true

# wipe.yml (tasks/wipe.yml). The x-ui service install.sh made, and the box's files: /etc/x-ui (proxy.json,
# chain/ with the hop secret and the chain document, chain-join.url), the install dir, the `x-ui` wrapper,
# the log dir, install.sh itself and a join token file left by an interrupted run.
hop_service: x-ui
hop_wipe_paths:
  - "{{ hop_proxy_config | dirname }}"
  - "{{ hop_bin | dirname }}"
  - "{{ hop_cli }}"
  - "{{ hop_log_dir }}"
  - "{{ hop_install_script }}"
  - "{{ hop_token_file }}"
# The Let's Encrypt IP certificate (hop_le_cert_dir) and acme.sh's renewal of it are kept by default: the
# next site.yml hands it to install.sh (hop_tls_reuse) instead of spending an LE issuance. true = delete
# it too, and the certificates acme.sh keeps for IP addresses in hop_acme_home.
hop_wipe_le_cert: false
hop_acme_home: /root/.acme.sh

# verify.yml (tasks/verify.yml): `x-ui chain status` must be fresh within retries x delay seconds. Two
# minutes: a revision (new inbound ports) reaches the hop next to the panel within one poll (chainPollSeconds
# 30 s, +-20 % jitter) and each hop further out within one more, and the relay restarts on the new ports.
hop_verify_retries: 12
hop_verify_delay: 10
# With hop_sub_scheme https, verify.yml also requires a non-empty cert in proxy.json and a TLS answer on
# this URL, fetched from the next-outer hop (an inner hop) or the controller (an edge);
# hop_verify_tls_probe_host overrides where it is fetched from (an inventory host or localhost).
hop_verify_tls_url: "https://{{ hop_host }}:{{ 443 if hop_front_mode == 'only443' else hop_sub_port }}/"
hop_verify_tls_probe_host: ""

# Neighbour target of every edge (tasks/neighbour.yml; SBKubric/sane-3x-ui ADR 0005, orchestrator#20): the site the
# Reality inbounds that follow the chain imitate while this edge is active, kept in the chain registry
# (realityTarget, realityServerName). Found by scanning the edge's /24 from the controller, never from a box: TLS 1.3,
# h2, X25519, no redirect to another host, not a CDN, and a real Reality handshake through a local xray pair.
# A stored target in the edge's /24 that still passes the handshake is kept (no scan, no write). With nothing found,
# the fallback below is written and the run and verify.yml warn. false = leave the registry fields alone.
hop_neighbour_enabled: true
# Per edge, in host_vars: a target of your own instead of the scan ("host:port"; an address needs the server
# name its site answers to). It is written as given; a failed handshake check only warns.
hop_reality_target: ""
hop_reality_server_name: ""
# Known-good shared target for an edge without a neighbour (passed the xray 26.3.27 handshake in
# SBKubric/sane-3x-ui#129). Empty server name = the target's host.
hop_reality_fallback_target: dl.google.com:443
hop_reality_fallback_server_name: ""
# The scan: addresses of the edge's /24 nearest to it first (the edge itself left out), at most this many, with this
# many parallel TLS probes and seconds each; then the best candidates get the handshake check, first pass wins.
hop_neighbour_port: 443
hop_neighbour_scan_limit: 254
hop_neighbour_scan_threads: 8
hop_neighbour_scan_timeout: 4
hop_neighbour_confirm: 3
# CDN filter: the candidate's AS (Team Cymru's whois, host:port; empty = skip) must not be one of these, and its
# HTTP answer must not carry a CDN's headers (Cloudflare, Akamai, Fastly, CloudFront; see neighbour.py).
hop_neighbour_asn_whois: whois.cymru.com:43
hop_neighbour_cdn_asns:
  - 13335   # Cloudflare
  - 209242  # Cloudflare Spectrum/WARP
  - 54113   # Fastly
  - 20940   # Akamai
  - 16625   # Akamai
  - 12222   # Akamai
  - 21342   # Akamai
  - 32787   # Akamai (Prolexic)
  - 35994   # Akamai
  - 33905   # Akamai
  - 16702   # Akamai
  - 18680   # Akamai
  - 18717   # Akamai
  - 23454   # Akamai
  - 23455   # Akamai
  - 24319   # Akamai
  - 34164   # Akamai
  - 43639   # Akamai
# The handshake check: a VLESS-Reality server with the candidate as target and a client through it, both xray on the
# controller (loopback only); passes when every one of the tries fetches the probe URL through the tunnel.
hop_neighbour_check_tries: 3
hop_neighbour_probe_url: https://www.cloudflare.com/cdn-cgi/trace
# Tools, downloaded once to the controller and checked against the pinned sha256 (linux amd64 or arm64). Set
# hop_neighbour_scanner_bin / hop_neighbour_xray_bin to use binaries you have instead.
hop_neighbour_cache: "{{ playbook_dir }}/.cache/neighbour"
hop_neighbour_scanner_version: v0.2.3
hop_neighbour_xray_version: v26.3.27
hop_neighbour_scanner_bin: ""
hop_neighbour_xray_bin: ""
hop_neighbour_downloads:
  scanner:
    x86_64:
      url: "https://github.com/XTLS/RealiTLScanner/releases/download/{{ hop_neighbour_scanner_version }}/RealiTLScanner-linux-amd64"
      sha256: a55595446de9f1c2e6c5c3cd766a7320a11115947df48f101749bb62c8055592
    aarch64:
      url: "https://github.com/XTLS/RealiTLScanner/releases/download/{{ hop_neighbour_scanner_version }}/RealiTLScanner-linux-arm64"
      sha256: 27bdd3e53d4391c66c8df3391d3c3fb5eb2dc356125f2fb33ac58fcaaf8f88b3
  xray:
    x86_64:
      url: "https://github.com/XTLS/Xray-core/releases/download/{{ hop_neighbour_xray_version }}/Xray-linux-64.zip"
      sha256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
    aarch64:
      url: "https://github.com/XTLS/Xray-core/releases/download/{{ hop_neighbour_xray_version }}/Xray-linux-arm64-v8a.zip"
      sha256: 4d30283ae614e3057f730f67cd088a42be6fdf91f8639d82cb69e48cde80413c
# The helper that scans and checks (python3 of the controller, standard library only).
hop_neighbour_script: "{{ role_path }}/files/neighbour.py"
hop_neighbour_command: ["{{ ansible_playbook_python }}", "{{ hop_neighbour_script }}"]
hop_neighbour_tool_args: >-
  {{ ['--cache', hop_neighbour_cache, '--downloads', hop_neighbour_downloads | to_json]
     + (['--xray', hop_neighbour_xray_bin] if hop_neighbour_xray_bin | length > 0 else [])
     + (['--scanner', hop_neighbour_scanner_bin] if hop_neighbour_scanner_bin | length > 0 else []) }}
hop_neighbour_check_args: >-
  {{ hop_neighbour_tool_args + ['--tries', hop_neighbour_check_tries | string, '--probe-url', hop_neighbour_probe_url] }}
hop_neighbour_find_args: >-
  {{ hop_neighbour_check_args
     + ['--port', hop_neighbour_port | string, '--limit', hop_neighbour_scan_limit | string,
        '--threads', hop_neighbour_scan_threads | string, '--timeout', hop_neighbour_scan_timeout | string,
        '--confirm', hop_neighbour_confirm | string, '--asn-whois', hop_neighbour_asn_whois,
        '--cdn-asns', hop_neighbour_cdn_asns | join(',')] }}
