---
# verify.yml on a hop box: x-ui runs xui_version, and `x-ui chain status` (the running hop, asked with its
# own secret) is fresh: it answers as hop_name, its chain document is not stale, the next hop is reachable
# and the relay runs with at least one port. Waits hop_verify_retries x hop_verify_delay seconds for a hop
# that just joined or has yet to poll a new port list.
- name: Read installed x-ui version
  ansible.builtin.command:
    argv: ["{{ hop_bin }}", "-v"]
  register: hop_verify_version
  changed_when: false
  failed_when: false

- name: Check the x-ui version
  ansible.builtin.assert:
    that:
      - hop_verify_version.rc == 0
      - hop_verify_version.stdout | trim == hop_version | regex_replace('^v', '')
    fail_msg: >-
      hop {{ hop_name }} ({{ inventory_hostname }}) is not {{ hop_version }}:
      `{{ hop_bin }} -v` says '{{ (hop_verify_version.stdout | default('') ~ ' ' ~ hop_verify_version.msg | default('')) | trim }}'
      (rc {{ hop_verify_version.rc | default('?') }}); run site.yml
    success_msg: "hop {{ hop_name }}: x-ui {{ hop_version }}"

- name: Wait for a fresh chain status
  ansible.builtin.command:
    argv: ["{{ hop_bin }}", chain, status, -c, "{{ hop_proxy_config }}"]
  register: hop_verify_status
  until: >-
    hop_verify_status.rc == 0
    and hop_verify_status.stdout is search('(?m)^name:\\s+' ~ (hop_name | regex_escape) ~ '\\s')
    and hop_verify_status.stdout is search('(?m)^next hop:.*\\(reachable: true\\)')
    and hop_verify_status.stdout is search('(?m)^relay:\\s+running=true ports=\\[\\S')
    and hop_verify_status.stdout is not search('(?m)^revision:.*stale')
  retries: "{{ hop_verify_retries | int }}"
  delay: "{{ hop_verify_delay | int }}"
  changed_when: false
  failed_when: false

- name: Explain what is wrong with the chain status
  ansible.builtin.set_fact:
    hop_verify_problems: >-
      {%- set out_ = hop_verify_status.stdout | default('') -%}
      {%- set problems = [] -%}
      {%- if hop_verify_status.rc | default(1) != 0 -%}
      {%-   set _ = problems.append('`x-ui chain status` failed (rc ' ~ hop_verify_status.rc | default('?') ~ '): '
                                    ~ ((out_ ~ ' ' ~ hop_verify_status.stderr | default('') ~ ' ' ~ hop_verify_status.msg | default('')) | trim)) -%}
      {%- else -%}
      {%-   if out_ is not search('(?m)^name:\\s+' ~ (hop_name | regex_escape) ~ '\\s') -%}
      {%-     set _ = problems.append('the box answers as ' ~ (out_ | regex_search('(?m)^name:\\s+(\\S+)', '\\1') | first | default('?'))
                                      ~ ', not ' ~ hop_name) -%}
      {%-   endif -%}
      {%-   if out_ is search('(?m)^revision:.*stale') -%}
      {%-     set _ = problems.append('its chain document is stale (no successful wave from the next hop for a while)') -%}
      {%-   endif -%}
      {%-   if out_ is not search('(?m)^next hop:.*\\(reachable: true\\)') -%}
      {%-     set _ = problems.append('the next hop is not reachable ('
                                      ~ (out_ | regex_search('(?m)^next hop:\\s+(.*)$', '\\1') | first | default('?')) ~ ')') -%}
      {%-   endif -%}
      {%-   if out_ is search('(?m)^relay:.*ports=\\[\\]') -%}
      {%-     set _ = problems.append('the relay carries no ports (the panel has no enabled inbound to relay: panel_inbounds'
                                    ~ ' in the inventory, or the hop has not polled the new revision yet)') -%}
      {%-   elif out_ is not search('(?m)^relay:\\s+running=true') -%}
      {%-     set _ = problems.append('the relay is not running') -%}
      {%-   endif -%}
      {%- endif -%}
      {{ problems }}

- name: Require a fresh chain status
  ansible.builtin.assert:
    that:
      - hop_verify_problems | length == 0
    fail_msg: >-
      hop {{ hop_name }} ({{ inventory_hostname }}) after {{ hop_verify_retries | int * hop_verify_delay | int }}s:
      {{ hop_verify_problems | join('; ') }}. See `x-ui chain status` and `journalctl -u {{ hop_service }}` on the box.
    success_msg: "hop {{ hop_name }}: {{ hop_verify_status.stdout_lines | default([]) | map('regex_replace', '\\s+', ' ') | join('; ') }}"

# hop_sub_scheme https: the box must still hold a certificate (a manual-TLS reinstall used to leave
# proxy.json with "cert": "", SBKubric/sane-3x-ui#124) and its sub port must answer TLS where the chain
# reaches it: from the next-outer hop, or from the controller for an edge. -k: this checks the scheme,
# not the certificate (inner hops often run self-signed or IP certificates).
- name: Check that the hop still serves TLS
  when: hop_sub_scheme == 'https'
  block:
    - name: Read proxy.json
      ansible.builtin.slurp:
        src: "{{ hop_proxy_config }}"
      register: hop_verify_proxy_json
      failed_when: false

    # verify.yml gathers no facts; hop_host defaults to this one.
    - name: Gather the hop's default address
      ansible.builtin.setup:
        gather_subset: ['!all', 'network']
        filter: ['ansible_default_ipv4']
      when: ansible_facts['default_ipv4'] is not defined

    # Resolved here, on the hop: under delegate_to, hop_host's default (ansible_facts) would be read from
    # the delegate, which is localhost for an edge and has no default_ipv4.
    - name: Choose where the sub port is probed from
      ansible.builtin.set_fact:
        hop_verify_tls_target: "{{ hop_verify_tls_url }}"
        hop_verify_tls_from: >-
          {%- set hops = groups['hops'] | map('extract', hostvars) | list -%}
          {%- set outer_inners = hops | selectattr('hop_role', 'defined') | selectattr('hop_role', 'equalto', 'inner')
                                   | selectattr('hop_position', 'defined')
                                   | selectattr('hop_position', 'gt', hop_position | default(0) | int) | sort(attribute='hop_position') | list -%}
          {%- set edges = hops | selectattr('hop_role', 'defined') | selectattr('hop_role', 'equalto', 'edge')
                            | sort(attribute='inventory_hostname') | list -%}
          {%- set edges = (edges | selectattr('hop_active', 'defined') | selectattr('hop_active') | list) + edges -%}
          {%- if hop_verify_tls_probe_host | length > 0 -%}{{ hop_verify_tls_probe_host }}
          {%- elif hop_role == 'edge' -%}localhost
          {%- elif outer_inners | length > 0 -%}{{ (outer_inners | first).inventory_hostname }}
          {%- elif edges | length > 0 -%}{{ (edges | first).inventory_hostname }}
          {%- else -%}localhost{%- endif -%}

    - name: Probe the sub port over https
      ansible.builtin.uri:
        url: "{{ hop_verify_tls_target }}"
        validate_certs: false
        follow_redirects: none
        timeout: 10
      # delegate_to is templated before the block's `when`: an http hop skips with its own name.
      delegate_to: "{{ hop_verify_tls_from | default(inventory_hostname) }}"
      register: hop_verify_tls
      failed_when: false

    - name: Require a certificate and a TLS answer on the sub port
      ansible.builtin.assert:
        that:
          - hop_verify_proxy_json.content is defined
          - (hop_verify_proxy_json.content | b64decode | from_json).cert | default('') | length > 0
          - hop_verify_tls.status | default(-1) | int > 0
        fail_msg: >-
          hop {{ hop_name }} ({{ inventory_hostname }}) has hop_sub_scheme https but
          {{ ('cannot read ' ~ hop_proxy_config ~ ': ' ~ hop_verify_proxy_json.msg | default('?'))
             if hop_verify_proxy_json.content is not defined else
             (hop_proxy_config ~ ' has an empty cert')
             if (hop_verify_proxy_json.content | b64decode | from_json).cert | default('') | length == 0 else '' }}{{
          '; ' if hop_verify_proxy_json.content is not defined
                  or (hop_verify_proxy_json.content | b64decode | from_json).cert | default('') | length == 0 else '' }}{{
          ('GET ' ~ hop_verify_tls_target ~ ' from ' ~ hop_verify_tls_from ~ ' got no TLS answer: ' ~ hop_verify_tls.msg | default('?'))
          if hop_verify_tls.status | default(-1) | int <= 0 else 'its sub port answers TLS' }}. The next-outer hop
          cannot poll it; reinstall it (site.yml) and see SBKubric/sane-3x-ui#124.
        success_msg: "hop {{ hop_name }}: TLS on {{ hop_verify_tls_target }} (from {{ hop_verify_tls_from }}), cert in proxy.json"
