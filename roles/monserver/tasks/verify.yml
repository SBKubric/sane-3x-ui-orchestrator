---
# verify.yml on the mon-server host: version, admin login with the vault account, and Settings -> Check
# (POST /admin/api/settings/check with the saved panelUrl, monToken, panelCa, realHost): the panel must be
# reachable and its probe configs readable. Check saves nothing.
- name: Read mon-server version
  ansible.builtin.command:
    argv: ["{{ monserver_bin_path }}", version]
  register: monserver_verify_version
  changed_when: false
  failed_when: false

- name: Check the mon-server version
  ansible.builtin.assert:
    that:
      - monserver_verify_version.rc == 0
      - monserver_verify_version.stdout | trim == 'mon-server ' ~ monserver_version
    fail_msg: >-
      mon-server on {{ inventory_hostname }} is not {{ monserver_version }}:
      `{{ monserver_bin_path }} version` says
      '{{ (monserver_verify_version.stdout | default('') ~ ' ' ~ monserver_verify_version.msg | default('')) | trim }}'; run site.yml
    success_msg: "{{ monserver_verify_version.stdout | trim }}"

- name: Log in to the mon-server admin API
  ansible.builtin.include_tasks: api_login.yml

- name: Read mon-server settings
  ansible.builtin.uri:
    url: "{{ monserver_api_url }}api/settings"
    headers:
      Cookie: "{{ monserver_api_cookie }}"
    validate_certs: false
    return_content: true
  delegate_to: "{{ monserver_api_host }}"
  register: monserver_verify_settings
  no_log: true

- name: Require the panel in mon-server's settings
  ansible.builtin.assert:
    that:
      - monserver_verify_settings.json.obj.settings.panelUrl | default('') | length > 0
      - monserver_verify_settings.json.obj.settings.monToken | default('') | length > 0
    fail_msg: >-
      mon-server has no panelUrl or monToken in its Settings; run site.yml with the panel play
      (e.g. --tags panel,monserver)
    quiet: true

- name: Check the panel from mon-server
  ansible.builtin.uri:
    url: "{{ monserver_api_url }}api/settings/check"
    method: POST
    headers:
      Cookie: "{{ monserver_api_cookie }}"
      X-Requested-With: XMLHttpRequest
    body_format: json
    body:
      panelUrl: "{{ monserver_verify_settings.json.obj.settings.panelUrl }}"
      monToken: "{{ monserver_verify_settings.json.obj.settings.monToken }}"
      panelCa: "{{ monserver_verify_settings.json.obj.settings.panelCa | default('') }}"
      realHost: "{{ monserver_verify_settings.json.obj.settings.realHost | default('') }}"
    validate_certs: false
    status_code: [200, 400, 502]
    return_content: true
  delegate_to: "{{ monserver_api_host }}"
  register: monserver_verify_check
  no_log: true

- name: Require "Panel reachable"
  ansible.builtin.assert:
    that:
      - monserver_verify_check.json.success | default(false) | bool
      - monserver_verify_check.json.msg | default('') == 'Panel reachable.'
    fail_msg: >-
      mon-server Settings -> Check (the saved panelUrl, monToken, panelCa):
      {{ monserver_verify_check.json.msg | default('HTTP ' ~ monserver_verify_check.status | default('?')) }}
    success_msg: >-
      mon-server Settings -> Check: {{ monserver_verify_check.json.msg | default('') }}
      (panel {{ monserver_verify_check.json.obj.panelVersion | default('?') }}, revision
      {{ monserver_verify_check.json.obj.revision | default('?') }}, {{ monserver_verify_check.json.obj.inbounds | default('?') }} inbounds)
