---
# fail2ban's jail for the showcase's misses (as the fronts' probe jail, SBKubric/sane-3x-ui#141). The miss log must
# exist before fail2ban starts (it refuses to start over one missing log), and on a box without sshd's log file
# (Debian 12/13 without rsyslog) the package's sshd jail reads the journal, as role panel sets it up. fail2ban is
# restarted, not reloaded, when a file changes: a reload can drop a jail's action (SBKubric/sane-3x-ui#152).
- name: Choose fail2ban's ban action
  ansible.builtin.command:
    argv: [sh, -c, "command -v iptables"]
  register: showcase_iptables
  changed_when: false
  failed_when: false
  check_mode: false
  when: showcase_fail2ban_banaction | length == 0

- name: Keep the ban action
  ansible.builtin.set_fact:
    showcase_fail2ban_action: >-
      {{ showcase_fail2ban_banaction if showcase_fail2ban_banaction | length > 0
         else ('iptables-multiport' if showcase_iptables.rc | default(1) == 0 else 'nftables-multiport') }}

- name: Create fail2ban's config directories
  ansible.builtin.file:
    path: "{{ showcase_fail2ban_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [jail.d, filter.d]

- name: Create the miss log
  ansible.builtin.file:
    path: "{{ showcase_miss_log }}"
    state: touch
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Look for sshd's log file
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/var/log/auth.log, /var/log/secure]
  register: showcase_auth_logs

- name: Point the sshd jail at the journal
  ansible.builtin.copy:
    dest: "{{ showcase_fail2ban_dir }}/jail.d/3ax-ui-sshd.local"
    content: |
      # Generated by 3AX-UI (#141): sshd logs to the journal on this box, and
      # fail2ban will not start while a jail's log file is missing.
      [sshd]
      backend = systemd
    force: false
    mode: "0644"
  when: showcase_auth_logs.results | selectattr('stat.exists') | list | length == 0
  notify: showcase restart fail2ban

- name: Write the showcase's filter
  ansible.builtin.template:
    src: showcase-filter.conf.j2
    dest: "{{ showcase_fail2ban_dir }}/filter.d/3ax-ui-showcase-probe.conf"
    mode: "0644"
  notify: showcase restart fail2ban

- name: Write the showcase's jail
  ansible.builtin.template:
    src: showcase-jail.conf.j2
    dest: "{{ showcase_fail2ban_dir }}/jail.d/3ax-ui-showcase.conf"
    mode: "0644"
  notify: showcase restart fail2ban

- name: Start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  when: showcase_manage_services | bool
