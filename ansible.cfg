[defaults]
# No default inventory: the profile is chosen explicitly with -i inventories/<profile>.
roles_path = ./roles
interpreter_python = auto_silent
# Stand hosts are reached as root through ssh aliases from ~/.ssh/config.
remote_user = root
retry_files_enabled = false
callback_result_format = yaml
forks = 10

[ssh_connection]
pipelining = true
# Keepalives: install.sh runs for minutes without output, and a NAT or firewall on the way must not
# drop the idle session (an UNREACHABLE there leaves the chain half-converged).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
