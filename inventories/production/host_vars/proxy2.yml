---
# Spare edge hop (standby); hop_next is derived (outermost inner hop = bridge).
# Switching the active edge to it is the owner's step (bot /proxy, chain editor or API);
# the neighbour target is scanned around its own /24 like proxy's.
hop_name: proxy2
hop_role: edge
hop_active: false
hop_tls: letsencrypt-ip
# Neighbour target kept in the vault (vault_reality_targets), not here: this repository is public and the
# target names the site the edge imitates. Unset there, the role scans the edge's /24 (README "Neighbour target").
hop_reality_target: "{{ (vault_reality_targets | default({}))['proxy2'] | default('') }}"
hop_reality_server_name: "{{ (vault_reality_server_names | default({}))['proxy2'] | default('') }}"
