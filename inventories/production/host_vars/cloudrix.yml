---
# Spare edge hop (standby), installed by hand on 2026-10-18; hop_next is derived (outermost inner hop = bridge).
# Switching the active edge to it is the owner's step (bot /proxy, chain editor or API) — and then hop_active here,
# or the next run switches back to proxy.
hop_name: cloudrix
hop_role: edge
hop_active: false
hop_tls: letsencrypt-ip
# Neighbour target kept in the vault (vault_reality_targets, vault_reality_server_names), not here: this repository
# is public and the target names the site the edge imitates. Unset there, the role scans the edge's /24
# (README "Neighbour target").
hop_reality_target: "{{ (vault_reality_targets | default({}))['cloudrix'] | default('') }}"
hop_reality_server_name: "{{ (vault_reality_server_names | default({}))['cloudrix'] | default('') }}"
