---
# Profile production: the chain panel <- bridge (inner) <- proxy (active edge) / proxy2 (standby edge), monitoring
# and the subscription showcase; the same shape as stand-full. Its secrets and addresses: inventories/production/group_vars/all/vault.yml.
# No addresses are committed: each host's ansible_host comes from vault_hosts in the vault, else its ssh alias
# (~/.ssh/config). The key is spelled out per host on purpose: a delegated task templates the delegated host's
# ansible_host with the delegating host's inventory_hostname, so a shared vault_hosts[inventory_hostname] connects
# a `delegate_to: real` task to the wrong box.
# Public addresses are taken from facts (default IPv4) unless overridden in host_vars.
all:
  children:
    panel:
      hosts:
        real:
          ansible_host: "{{ (vault_hosts | default({}))['real'] | default('real') }}"
    hops:
      hosts:
        bridge:
          ansible_host: "{{ (vault_hosts | default({}))['bridge'] | default('bridge') }}"
        proxy:
          ansible_host: "{{ (vault_hosts | default({}))['proxy'] | default('proxy') }}"
        proxy2:
          ansible_host: "{{ (vault_hosts | default({}))['proxy2'] | default('proxy2') }}"
    monserver:
      hosts:
        # Inventory names differ from the group names to avoid host/group name clashes.
        mon-server:
          ansible_host: "{{ (vault_hosts | default({}))['mon-server'] | default('monserver') }}"
    monclient:
      hosts:
        mon-client:
          ansible_host: "{{ (vault_hosts | default({}))['mon-client'] | default('monclient') }}"
    # Subscription showcase (role showcase, orchestrator#53): a VPS of its own under sub.<dns_zone>. Its address is
    # vault_hosts.subgateway; dns_zone, dnsexit_api_key, vpn_name and domain_expiry are kept in the vault too, because
    # the domain's records point at the production addresses.
    showcase:
      hosts:
        subgateway:
          ansible_host: "{{ (vault_hosts | default({}))['subgateway'] | default('subgateway') }}"
