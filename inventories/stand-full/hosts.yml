---
# Profile stand-full: panel + proxy chain + monitoring (mon-server and one mon-client).
# Hostnames are ssh aliases (~/.ssh/config: HostName, User root, key); no addresses are committed.
# Public addresses are taken from facts (default IPv4) unless overridden in host_vars.
all:
  children:
    panel:
      hosts:
        real:
    hops:
      hosts:
        bridge:
        proxy:
    monserver:
      hosts:
        # Inventory names differ from the group names to avoid host/group name clashes;
        # ansible_host is the ssh alias.
        mon-server:
          ansible_host: monserver
    monclient:
      hosts:
        mon-client:
          ansible_host: monclient
