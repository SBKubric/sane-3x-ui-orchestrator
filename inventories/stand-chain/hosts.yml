---
# Profile stand-chain: panel + proxy chain only; monitoring groups are empty and their plays are skipped.
# No addresses are committed: ansible_host comes from vault_hosts in the vault (group_vars/all/main.yml);
# a host without an entry is reached by its name as an ssh alias (~/.ssh/config).
# Public addresses are taken from facts (default IPv4) unless overridden in host_vars.
all:
  children:
    panel:
      hosts:
        real:
    hops:
      hosts:
        bridge:
        proxy:
    monserver:
      hosts: {}
    monclient:
      hosts: {}
