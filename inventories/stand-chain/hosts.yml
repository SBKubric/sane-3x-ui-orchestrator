---
# Profile stand-chain: panel + proxy chain only; monitoring groups are empty and their plays are skipped.
# Hostnames are ssh aliases (~/.ssh/config: HostName, User root, key); no addresses are committed.
# Public addresses are taken from facts (default IPv4) unless overridden in host_vars.
all:
  children:
    panel:
      hosts:
        real:
    hops:
      hosts:
        bridge:
        proxy:
    monserver:
      hosts: {}
    monclient:
      hosts: {}
    # Subscription showcase (role showcase, orchestrator#53): a VPS of its own under sub.<dns_zone>. None on the stand
    # yet; an empty group is skipped. Example (an ssh alias as for the other boxes):
    #   showcase:
    #     hosts:
    #       subgateway:
    showcase:
      hosts: {}
