---
# Inbounds of the panel, converged by role panel through the panel API (README "Inbounds"), matched by
# remark. The Reality keys (the panel's generator) and shortId (made once by the role) are created with the
# inbound, the AWG server's keys by the panel itself; afterwards they are only read back from the panel.
# Nothing secret lives here or in the vault.
# With front_mode only443 every hop passes 443/tcp on by SNI and relays 51820/udp.
panel_inbounds:
  - remark: vless-reality
    protocol: vless
    # The panel's front relocates it to 127.0.0.1:8443 and publishes it on 443 (clients connect to 443).
    port: 8443
    # Follows the chain: the panel sets target and serverNames to the active edge's neighbour target.
    followChain: true
    settings:
      decryption: none
      fallbacks: []
    streamSettings:
      # XHTTP, not TCP + Vision: the flow of a Vision client is TCP only and is cleared on migration.
      network: xhttp
      security: reality
      # target/serverNames apply until an edge is active; then the chain owns them (followChain).
      realitySettings:
        show: false
        xver: 0
        target: dl.google.com:443
        serverNames: [dl.google.com]
        settings:
          fingerprint: chrome
          serverName: ""
          spiderX: /
      xhttpSettings:
        path: /
        host: ""
        # auto: the server takes every mode; xray-core clients pick stream-one with Reality.
        mode: auto
    sniffing:
      enabled: true
      destOverride: [http, tls, quic]
      metadataOnly: false
      routeOnly: false
  - remark: awg
    protocol: amneziawg
    port: 51820
