---
# The AmneziaWG route step of verify.yml alone, against mock_panel.py (see test_panel_inbounds.py).
- name: Verify the AmneziaWG route
  hosts: panel
  gather_facts: false
  tasks:
    - name: Log in to the panel (verify.yml has done it before its checks)
      ansible.builtin.include_role:
        name: panel
        tasks_from: api_login

    - name: Check routeViaXray and the TPROXY inbound
      ansible.builtin.include_role:
        name: panel
        tasks_from: verify_awg
