---
# Test inventory for role hop (and the chain part of verify.yml) against mock_panel.py: every host is local, each hop box is a directory
# under HOP_TEST_ROOT, install.sh is fake_install.sh served by the mock. Driven by test_hop_role.py.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    hop_test_root: "{{ lookup('ansible.builtin.env', 'HOP_TEST_ROOT') }}"
    hop_test_panel: "http://127.0.0.1:{{ lookup('ansible.builtin.env', 'HOP_TEST_PORT') }}"
    xui_version: "{{ hop_test_version | default('v1.9.0-chain.4') }}"
    # Vault values and the API endpoint of role panel's api_login, pointed at the mock.
    panel_user: admin
    panel_password: secret-pass
    panel_port: 2053
    panel_base_path: /base/
    panel_api_url: "{{ hop_test_panel }}/base/"
    # uri loads ca_path even for http; any CA bundle will do.
    panel_api_ca_path: /etc/ssl/certs/ca-certificates.crt
    hop_panel_host: 10.0.0.1
    hop_install_url: "{{ hop_test_panel }}/install.sh"
    hop_bin: "{{ hop_test_root }}/{{ inventory_hostname }}/x-ui"
    hop_install_script: "{{ hop_test_root }}/{{ inventory_hostname }}/install.sh"
    hop_token_file: "{{ hop_test_root }}/{{ inventory_hostname }}/token"
    hop_le_cert_dir: "{{ hop_test_root }}/{{ inventory_hostname }}/cert"
    hop_proxy_config: "{{ hop_test_root }}/{{ inventory_hostname }}/proxy.json"
    # verify.yml's TLS check of an https hop: a local TLS server of test_hop_role.py stands in for every sub port.
    hop_verify_tls_url: "{{ lookup('ansible.builtin.env', 'HOP_TEST_TLS_URL') }}"
    hop_install_environment:
      FAKE_BOX_DIR: "{{ hop_test_root }}/{{ inventory_hostname }}"
      FAKE_PANEL: "{{ hop_test_panel }}"
    # Neighbour target (tasks/neighbour.yml): off unless a test passes hop_test_neighbour=true; fake_neighbour.py stands
    # in for neighbour.py (no scanner, no xray, no network).
    hop_neighbour_enabled: "{{ hop_test_neighbour | default(false) }}"
    hop_neighbour_script: "{{ inventory_dir }}/fake_neighbour.py"
    hop_join_retries: 2
    hop_join_delay: 1
    # verify.yml: one retry, and a fake panel binary for the panel's version check.
    hop_verify_retries: 1
    hop_verify_delay: 1
    # The «only 443» front (orchestrator#21): off unless a test passes hop_test_front=only443; the box reports its front
    # through the mock right after joining, so one retry is enough. verify.yml's scan of the boxes' ports needs real
    # addresses and is left to tests/common.
    front_mode: "{{ hop_test_front | default('off') }}"
    hop_front_retries: 1
    hop_front_delay: 1
    verify_front_scan: false
    # verify.yml's geosite ru-inside check is covered by tests/panel/test_ru_inside.py.
    panel_ru_inside_enabled: false
  children:
    panel:
      hosts:
        real:
          panel_bin: "{{ hop_test_root }}/real/x-ui"
    hops:
      hosts:
        bridge:
          hop_role: inner
          hop_position: 1
          hop_active: "{{ hop_test_bridge_active | default(false) }}"
          hop_host: 10.0.0.2
          hop_tls: "{{ hop_test_bridge_tls | default('none') }}"
          hop_cert: /root/cert/bridge.pem
          hop_key: /root/cert/bridge.key
          hop_reality_target: "{{ hop_test_bridge_reality_target | default('') }}"
        proxy:
          hop_role: edge
          hop_active: true
          hop_host: "{{ hop_test_proxy_host | default('10.0.0.3') }}"
          hop_reality_target: "{{ hop_test_reality_target | default('') }}"
          hop_reality_server_name: "{{ hop_test_reality_server_name | default('') }}"
    monserver:
      hosts: {}
    monclient:
      hosts: {}
