---
# Post-deploy checks; imported last by site.yml (tag verify) and runnable on its own:
#   ansible-playbook -i inventories/<profile> verify.yml
# Read-only: logins, GET requests, mon-server's Settings -> Check (which saves nothing) and `x-ui chain
# status`. The plays run for real under --check too. An empty group is skipped (stand-chain has no
# monitoring). Checks, in order:
#   panel      version; API login with the vault account; chain/list: every hop of group hops joined,
#              the active edge = the hop with hop_active
#   panel      (front_mode only443) every hop behind its front: 443/https in the chain registry
#   panel      geosite:ru-inside: the rule in the Xray template, the list in xray's asset folder (a warning when
#              its last good check is older than panel_ru_inside_max_age_days), the daily timer active
#   panel      WARP: the warp outbound (WireGuard, noKernelTun) and the rule tcp,udp -> warp last in the Xray template;
#              the panel host's own cdn-cgi/trace reported (warp=off there is the baseline: the rule routes the traffic
#              that comes in through the inbounds, and the clients see warp=on)
#   panel      AmneziaWG: routeViaXray on and the TPROXY inbound (awg-tproxy-in) in the config xray runs; a warning
#              otherwise (its clients would leave directly, past ru-inside and WARP)
#   panel      AmneziaWG: the server's I1 against awg_mimic_protocol (a warning, no failure)
#   panel      AmneziaWG 3.0 (awg_v3): the server's awg0.conf has the panel's HeaderProtectionKey, S1-S4 and 3.0 fields, and a
#              client's .conf (awg_verify_client) the same key; a server without header protection or with S1-S4 below 12
#              is a warning (it waits for awg_obfuscation_apply), so is a kernel module without 3.0
#   panel      (with vpn_name) the VPN name's A record at DNSExit's nameservers is the active edge's address (a warning,
#              no failure: the panel moves it at most once in 4 minutes, resolvers keep the old one for its TTL)
#   panel      (with a showcase) the showcase's address is among the panel's frontTrustedAddrs (a warning, no failure)
#   hops       version; `x-ui chain status` fresh (answers as hop_name, not stale, next hop reachable,
#              relay running), waiting up to 2 minutes (a new port list takes a poll per hop); with
#              hop_sub_scheme https also a cert in proxy.json and a TLS answer on the sub port (443 behind the
#              front), fetched from the next-outer hop (the controller for an edge); an edge's neighbour target in
#              the registry (a warning, no failure, for the shared fallback or none, and for a server name that does
#              not resolve into the edge's /24)
#   panel+hops (front_mode only443) from the controller: the box answers TCP on 443 and not on its old ports (the
#              panel's port, the sub port 2096, the inbounds' ports), waiting up to 2 minutes; 80 closed is a warning;
#              on the panel <base>panel/ gets the cover page, not the UI, and POST <base>login works on 443
#   monserver  version; admin login; Settings -> Check says "Panel reachable." (so the panel speaks mon-server's
#              contract) and counts probe links on direct and on every hop of group hops
#   monclient  version; ONLINE in mon-server's registry, waiting up to 3 minutes
#   panel      (with mon-clients) every enabled inbound (AWG included) has a target per mon-client and path
#              (mon_paths expanded over group hops: hops -> edge:/inner:<hop_name>), all UP, waiting up to 3 minutes
#   showcase   nginx config; 80 -> https://<domain>/; 443 with a certificate for the name and the cover page; an unknown
#              subscription through every edge ends on the cover page; showcase_verify_sub comes back with
#              Subscription-Userinfo; the fail2ban jail has an action; 80 and 443 from the controller; the DNS record
#              (a warning, no failure)

- name: Verify panel and chain registry
  hosts: panel
  gather_facts: false
  check_mode: false
  tasks:
    - name: Verify the panel
      ansible.builtin.include_role:
        name: panel
        tasks_from: verify

- name: Verify chain hops
  hosts: hops
  gather_facts: false
  check_mode: false
  tasks:
    - name: Verify the hop box
      ansible.builtin.include_role:
        name: hop
        tasks_from: verify

- name: Verify that only 443 answers
  hosts: panel:hops
  gather_facts: false
  check_mode: false
  tasks:
    - name: Scan the box and try its front from the controller
      ansible.builtin.include_role:
        name: common
        tasks_from: verify_front
      when:
        - hop_front_mode | default(front_mode | default('only443')) == 'only443'
        - verify_front_scan | default(true) | bool

- name: Verify monitoring server
  hosts: monserver
  gather_facts: false
  check_mode: false
  tasks:
    - name: Verify mon-server
      ansible.builtin.include_role:
        name: monserver
        tasks_from: verify

- name: Verify monitoring clients
  hosts: monclient
  gather_facts: false
  check_mode: false
  tasks:
    - name: Verify mon-client
      ansible.builtin.include_role:
        name: monclient
        tasks_from: verify

- name: Verify monitoring targets
  hosts: panel
  gather_facts: false
  check_mode: false
  tasks:
    - name: Verify that every target is UP
      ansible.builtin.include_role:
        name: panel
        tasks_from: verify_targets
      when: groups['monclient'] | default([]) | length > 0

# Last, as in site.yml (orchestrator#64): a failing showcase, a single host, would end the run before the monitoring checks.
- name: Verify subscription showcase
  hosts: showcase
  gather_facts: false
  check_mode: false
  tasks:
    - name: Verify the showcase
      ansible.builtin.include_role:
        name: showcase
        tasks_from: verify
