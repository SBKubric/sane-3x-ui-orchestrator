---
# Converges the whole installation described by the inventory profile:
#   ansible-playbook -i inventories/<profile> site.yml
# One play per group, in order panel -> hops -> (panel inbounds again) -> monserver -> monclient -> showcase.
# front_mode only443 (default) converges from the inside out: the panel behind its front, then each hop from the
# panel outward, each waiting for its front report (443/https in the registry) before the next (README "Front").
# An empty group (e.g. monserver/monclient in stand-chain) matches no hosts and is skipped.
# site.yml never wipes anything; a fresh start is wipe.yml followed by site.yml.

- name: Common host setup
  hosts: all
  tags: [common]
  roles:
    - role: common

- name: Panel
  hosts: panel
  gather_facts: false
  tags: [panel]
  roles:
    - role: panel

- name: Proxy chain hops
  hosts: hops
  gather_facts: false
  tags: [hops]
  roles:
    - role: hop

# A second pass over panel_inbounds once the hops play has written the active edge's neighbour target: an inbound
# with followChain whose flag had to wait for it (an existing chain moving to «only 443») is flagged now, and the
# panel gives it the neighbour's cover. On a converged panel it reads and writes nothing.
- name: Chain-following inbounds
  hosts: panel
  gather_facts: false
  tags: [panel, hops]
  tasks:
    - name: Converge the inbounds that follow the chain
      ansible.builtin.include_role:
        name: panel
        tasks_from: inbounds
      when: panel_inbounds | default([]) | selectattr('followChain', 'defined') | selectattr('followChain') | list | length > 0

- name: Monitoring server
  hosts: monserver
  gather_facts: false
  tags: [monserver]
  roles:
    - role: monserver

- name: Monitoring clients
  hosts: monclient
  gather_facts: false
  tags: [monclient]
  roles:
    - role: monclient

# The subscription showcase (orchestrator#53): a VPS of its own that passes the panel's subscription paths to the edges,
# so it comes after the hops; empty group showcase = skipped. It is the last play on purpose (orchestrator#64): when
# every host of a play fails, Ansible ends the whole run ("no hosts left"), and the showcase is a single host that
# depends on things outside the installation (DNSExit's API and nameservers, Let's Encrypt). Nothing after it needs it
# (role panel takes the showcase's address from the inventory), so a showcase that fails costs only its own play and
# verify.yml, not the monitoring.
- name: Subscription showcase
  hosts: showcase
  gather_facts: false
  tags: [showcase]
  roles:
    - role: showcase

- name: Verify
  ansible.builtin.import_playbook: verify.yml
  tags: [verify]
